,"originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-programme-0001.webp"},{"uid":"dmopn9i37hx3tw","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-programme-0002.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Event Programme","fr":"","de":""},"text":{"en":"\u003cp>kurt lesser-\u003c/p>\n\n\u003cp>programme for the international communication exhibition\u003cbr>programme for the international communication exhibition 27/1–10/2\u003c/p>\n\n\u003cp>27/1   fri.  free jazz session with jesper ravn, tom krøjer, don cherry, etc.\u003c/p>\n\n\u003cp>28/1   jaroslaw kozlowski: performance of colours\u003c/p>\n\n\u003cp>saturday 29/1:\u003c/p>\n\n\u003cp>from the provisional programme, the following may be mentioned:\u003cbr>saturday 29 january at 15.00: concert with gunnar nilsson,\u003cbr>bass, arne olsen, trumpet, leo nilsson, synthesizer, tom krøjer, saxophone\u003cbr>free jazz, electronic session. +bo ingvar olsson and maybe john thorsen\u003cbr>saturday 29 jan. at 20.00: eric andersen: seated passers-by,\u003cbr>action with chairs\u003cbr>sunday 30 jan.: at 19.00: the documentary film b-52. a film about\u003cbr>u.s. bombings of vietnam — a film with newsreel excerpts\u003cbr>from 64 to 72 — 2 teachers. (40 min.)\u003cbr>at 21: tom krøjer: “kunst konsumeres ikke”\u003cbr>tuesday 1 feb. at 20: poetry and music with, provisionally:\u003cbr>the poets sven holm, lean nielsen, henrik nordbrandt, ole henrik\u003cbr>kock and tom krøjer.\u003cbr>wednesday 2 feb. at 20: sven dalsgaard.\u003cbr>thursday 3 feb. at 10: eee at 20: marie stuart, a mixed scene\u003cbr>from frau schiller’s plays, with lene adler petersen and bjørn\u003cbr>nørgaard.\u003cbr>otherwise, non-stop performance every day from 10 to 23.\u003cbr>in the exhibition, work is being done with telex\u003cbr>15379 peace dk\u003cbr>and with video in colour and black/white, as well as image transmission.\u003cbr>huset, magstræde 14, 1st and 2nd floor. entrance 10 kr.\u003c/p>\n\n\u003cp>press release:\u003c/p>\n\n\u003cp>programme for the international communication exhibition at “huset”:\u003c/p>\n\n\u003cp>sunday 6/2 at 20:      kirsten dehlholm\u003cbr>                       “talks with long paraphrases and short pauses”\u003c/p>\n\n\u003cp>monday 7/2 at 20:      anne-lise bock\u003cbr>                       “fredens dancing queen, stripper and singer”\u003c/p>\n\n\u003cp>tuesday 8/2 at 20:     niels viggo bentzon\u003cbr>                       “objects and sounds” + anne behrndt larsen og cy\u003cbr>                       “avalose”\u003c/p>\n\n\u003cp>wednesday 9/2 at 20:   media-happening (see daily press announcement)\u003c/p>\n\n\u003cp>thursday 10/2 at 20:   jørgen nash\u003cbr>                       “the rebel in our red blood”\u003c/p>\n\n\u003cp>a lyrical cavalcade from 1942–77 with commentary\u003cbr>                       accompaniment by tømrer-klaus, etc.\u003c/p>","fr":"\u003cp>kurt lesser-\u003c/p>\n\n\u003cp>programme pour l’exposition internationale de communication\u003cbr>programme pour l’exposition internationale de communication 27/1–10/2\u003c/p>\n\n\u003cp>27/1   ven.  session de free jazz avec jesper ravn, tom krøjer, don cherry, etc.\u003c/p>\n\n\u003cp>28/1   jaroslaw kozlowski : performance of colours\u003c/p>\n\n\u003cp>samedi 29/1 :\u003c/p>\n\n\u003cp>du programme provisoire, on peut mentionner :\u003cbr>samedi 29 janvier à 15.00 : concert avec gunnar nilsson,\u003cbr>basse, arne olsen, trompette, leo nilsson, synthétiseur, tom krøjer, saxophone\u003cbr>session de free jazz. +bo ingvar olsson et peut-être john thorsen\u003cbr>samedi 29 janv. à 20.00 : eric andersen : seated passers-by,\u003cbr>action avec chaises\u003cbr>dimanche 30 janv. : à 19.00 : le film documentaire b-52. un film sur\u003cbr>les bombardements des usa au vietnam — un film avec des extraits de journaux filmés\u003cbr>de 64 à 72 — 2 enseignants. (40 min.)\u003cbr>à 21 : tom krøjer : « kunst konsumeres ikke »\u003cbr>mardi 1er févr. à 20 : poésie et musique avec, provisoirement :\u003cbr>les poètes sven holm, lean nielsen, henrik nordbrandt, ole henrik\u003cbr>kock et tom krøjer.\u003cbr>mercredi 2 févr. à 20 : sven dalsgaard.\u003cbr>jeudi 3 févr. à 10 : eee à 20 : marie stuart, une scène mixte\u003cbr>des pièces de frau schillers, avec lene adler petersen et bjørn\u003cbr>nørgaard.\u003cbr>par ailleurs, performance non-stop tous les jours de 10 à 23.\u003cbr>dans l’exposition, on travaille avec le télex\u003cbr>15379 peace dk\u003cbr>et avec la vidéo en couleur et en noir/blanc ainsi qu’avec la transmission d’images.\u003cbr>huset, magstræde 14, 1er et 2e étage. entrée 10 kr.\u003c/p>\n\n\u003cp>communiqué de presse :\u003c/p>\n\n\u003cp>programme pour l’exposition internationale de communication à « huset » :\u003c/p>\n\n\u003cp>dimanche 6/2 à 20 :    kirsten dehlholm\u003cbr>                       « discussions avec longues paraphrases et courtes pauses »\u003c/p>\n\n\u003cp>lundi 7/2 à 20 :       anne-lise bock\u003cbr>                       « la reine dansante, stripteaseuse et chanteuse de fredens »\u003c/p>\n\n\u003cp>mardi 8/2 à 20 :       niels viggo bentzon\u003cbr>                       « objets et sons » + anne behrndt larsen og cy\u003cbr>                       « avalose »\u003c/p>\n\n\u003cp>mercredi 9/2 à 20 :    media-happening (voir annonce dans la presse quotidienne)\u003c/p>\n\n\u003cp>jeudi 10/2 à 20 :      jørgen nash\u003cbr>                       « le rebelle dans notre sang rouge »\u003c/p>\n\n\u003cp>une cavalcade lyrique de 1942–77 avec commentaire\u003cbr>                       accompagnement par tømrer-klaus, etc.\u003c/p>","de":"\u003cp>kurt lesser-\u003c/p>\n\n\u003cp>programm für die internationale kommunikationsausstellung\u003cbr>programm für die internationale kommunikationsausstellung 27/1–10/2\u003c/p>\n\n\u003cp>27/1   fr.   free-jazz-session mit jesper ravn, tom krøjer, don cherry u. a.\u003c/p>\n\n\u003cp>28/1   jaroslaw kozlowski: performance of colours\u003c/p>\n\n\u003cp>samstag 29/1:\u003c/p>\n\n\u003cp>aus dem vorläufigen programm können genannt werden:\u003cbr>samstag, den 29. januar um 15.00: konzert mit gunnar nilsson,\u003cbr>bass, arne olsen, trompete, leo nilsson, synthesizer, tom krøjer, saxophon\u003cbr>free-jazz, elektronische session. +bo ingvar olsson und vielleicht john thorsen\u003cbr>samstag, den 29. jan. um 20.00: eric andersen: seated passers-by,\u003cbr>aktion mit stühlen\u003cbr>sonntag 30. jan.: um 19.00: der dokumentarfilm b-52. ein film über\u003cbr>die bombardierungen der usa in vietnam — ein film mit ausschnitten aus wochenschauen\u003cbr>von 64 bis 72 — 2 lehrer. (40 min.)\u003cbr>um 21: tom krøjer: „kunst konsumeres ikke“\u003cbr>dienstag, den 1. febr. um 20: lyrik und musik mit vorläufig:\u003cbr>den dichtern sven holm, lean nielsen, henrik nordbrandt, ole henrik\u003cbr>kock und tom krøjer.\u003cbr>mittwoch, den 2. febr. um 20: sven dalsgaard.\u003cbr>donnerstag, den 3. febr. um 10: eee um 20: marie stuart, eine gemischte szene\u003cbr>aus frau schillers stücken, mit lene adler petersen und bjørn\u003cbr>nørgaard.\u003cbr>außerdem non-stop-performance jeden tag von 10 bis 23.\u003cbr>in der ausstellung wird mit telex gearbeitet\u003cbr>15379 peace dk\u003cbr>und mit video in farbe und schwarz/weiß sowie mit bildübertragung.\u003cbr>huset, magstræde 14, 1. und 2. stock. eintritt 10 kr.\u003c/p>\n\n\u003cp>pressemitteilung:\u003c/p>\n\n\u003cp>programm für die internationale kommunikationsausstellung im „huset“:\u003c/p>\n\n\u003cp>sonntag 6/2 um 20:     kirsten dehlholm\u003cbr>                       „gespräche mit langen umschreibungen und kurzen pausen“\u003c/p>\n\n\u003cp>montag 7/2 um 20:      anne-lise bock\u003cbr>                       „fredens tanzende königin, stripperin und sängerin“\u003c/p>\n\n\u003cp>dienstag 8/2 um 20:    niels viggo bentzon\u003cbr>                       „objekte und klänge“ + anne behrndt larsen og cy\u003cbr>                       „avalose“\u003c/p>\n\n\u003cp>mittwoch 9/2 um 20:    media-happening (siehe ankündigung in der tagespresse)\u003c/p>\n\n\u003cp>donnerstag 10/2 um 20: jørgen nash\u003cbr>                       „der rebell in unserem roten blut“\u003c/p>\n\n\u003cp>eine lyrische kavalkade von 1942–77 mit kommentar\u003cbr>                       begleitung durch tømrer-klaus u. a.\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-programme-0002.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-programme-0002.webp"},{"uid":"dmopn9i37l0y0x","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-don-cherry-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Don Cherry. Handwritten Concert Announcement","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-don-cherry-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-don-cherry-0001.webp"},{"uid":"dmopn9i37v79at","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-fri-jazz-konzert-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Free Jazz. Handwritten Event Announcement","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-fri-jazz-konzert-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-fri-jazz-konzert-0001.webp"},{"uid":"dmopn9i37e3g18","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-kozlowski-toredrag-om-farver-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Jarosław Kozłowski. Handwritten Event Announcement","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-kozlowski-toredrag-om-farver-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-kozlowski-toredrag-om-farver-0001.webp"},{"uid":"dmopn9i37gyb6u","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-elektronisk-koncert-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Concert. Handwritten Concert Announcement","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-elektronisk-koncert-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-elektronisk-koncert-0001.webp"},{"uid":"dmopn9i379i90s","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-eric-andersen-aktion-med-stole-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Eric Andersen . Handwritten Event Announcement","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-eric-andersen-aktion-med-stole-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-eric-andersen-aktion-med-stole-0001.webp"},{"uid":"dmopn9i37q93sn","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-tom-krojer-okonomi-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Tom Krøjer. Handwritten Event Announcement","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-tom-krojer-okonomi-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-tom-krojer-okonomi-0001.webp"},{"uid":"dmopn9i37aq3bu","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-lene-adler-petersen-bjorn-norgaard-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Announcement for a Maria Stuart Performance with Lene Adler Petersen and Bjørn Nørgaard","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-lene-adler-petersen-bjorn-norgaard-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-lene-adler-petersen-bjorn-norgaard-0001.webp"},{"uid":"dmopn9i37cu3vh","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-bjorn-norgard-lene-adler-maria-stuart-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Bjørn Nørgård and Lene Adler Announcement Maria Stuart","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-bjorn-norgard-lene-adler-maria-stuart-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-bjorn-norgard-lene-adler-maria-stuart-0001.webp"},{"uid":"dmopn9i37j5ohi","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-tom-krojer-1-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Press Release on the First Five Days of the International Communication Event, 1 February 1977- 1/2","fr":"Peace Please. Communiqué de presse sur les cinq premiers jours de la manifestation internationale sur la communication, 1er février 1977 – 1/2","de":"Peace Please. Pressemitteilung zu den ersten fünf Tagen der internationalen Kommunikationsveranstaltung, 1. Februar 1977 – 1/2"},"text":{"en":"international communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex number\nNo. 15379 peace Dk.\nCopenhagen, 1 February 1977\nTo the press\nDuring the first five days of the “international communication event,” the art exhibition connected to the event has received works from more than 60 artists from a number of countries. Artists working with new forms of expression, concepts based on photography, offset, objects, images transmitted by telecopies, etc.\nThe exhibition is enlarged with new works every day. Through the exhibition’s telex and photocopies, works, ideas, and questions are received every day from artists in many countries.\nDuring the first week of the exhibition there is also a special colour video studio that has recorded performances and concerts that have taken place. These works are shown during the day in the exhibition itself. So far there have been recordings of events with:\nLeo Nilsson, Swedish electronic composer, and the musicians Arne Olsson, Bo Jagvar Olsson and Tom Krøjer.\nLecture and performance with the Polish art philosopher Jarosław Kozłowski.\nPerformance and happening with the artist Eric Andersen.\nConcert with Don Cherry on African instruments.\nAvant-garde jazz with Jesper Zeuten and John Ravns’ free jazz group.\nConcert with Ballonparkens Balloner.\nLecture and happening with Tom Krøjer.\nIn the coming period there will be a number of events of a similar kind.","fr":"international communication event 27/1 - 10/2. 1977. copenhagen Dk. telephone 01 - 142665. huset Tom Krøjer magstræde 14. 1166. copenhagen. K. Numéro de télex N° 15379 peace Dk. Copenhague, le 1er février 1977 À la presse Au cours des cinq premiers jours de « l’événement international de communication », l’exposition d’art liée à l’événement a reçu des œuvres de plus de 60 artistes provenant de plusieurs pays. Des artistes travaillant avec de nouvelles formes d’expression, des concepts à partir de la photographie, de l’offset, des objets, des images transmises par télécopies, etc. L’exposition s’accroît chaque jour de nouvelles œuvres. Sur le télex et les photocopies de l’exposition, sont reçus chaque jour des œuvres, des idées et des questions envoyées par des artistes de nombreux pays. Au cours de la première semaine de l’exposition, un studio vidéo couleur spécial a également enregistré les spectacles et concerts qui ont eu lieu. Ces œuvres sont projetées pendant la journée dans l’exposition elle-même. Il y a eu jusqu’à présent des enregistrements d’événements avec : Leo Nilsson, compositeur électronique suédois, et les musiciens Arne Olsson, Bo Jagvar Olsson et Tom Krøjer. Conférence et représentation avec le philosophe de l’art polonais Jarosław Kozłowski. Performance et happening avec l’artiste Eric Andersen. Concert avec Don Cherry sur instruments africains. Jazz d’avant-garde avec Jesper Zeuten et le groupe de free jazz de John Ravns. Concert avec Ballonparkens Balloner. Conférence et happening avec Tom Krøjer. Dans le temps à venir, il y aura une série d’événements de nature comparable.","de":"international communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex-Nummer\nNr. 15379 peace Dk.\nKopenhagen, den 1. Februar 1977\nAn die Presse\nIn den ersten fünf Tagen der „internationalen Kommunikationsveranstaltung“ sind für die mit der Veranstaltung verbundene Kunstausstellung Werke von über 60 Künstlern aus einer Reihe von Ländern eingegangen. Künstler, die mit neuen Ausdrucksformen arbeiten, mit Konzepten ausgehend von Fotografie, Offset, Objekten, durch Telekopien übertragenen Bildern usw.\nDie Ausstellung wird täglich durch neue Werke erweitert. Über das Telex und die Fotokopien der Ausstellung gehen jeden Tag Werke, Ideen und Fragen von Künstlern aus vielen Ländern ein.\nIn der ersten Woche der Ausstellung gibt es außerdem ein spezielles Farbvideostudio, das Aufnahmen von den Aufführungen und Konzerten gemacht hat, die stattgefunden haben. Diese Werke werden tagsüber in der Ausstellung selbst abgespielt. Bisher gab es Aufnahmen von Veranstaltungen mit:\nLeo Nilsson, schwedischer Elektronikkomponist, und den Musikern Arne Olsson, Bo Jagvar Olsson und Tom Krøjer.\nVortrag und Aufführung mit dem polnischen Kunstphilosophen Jarosław Kozłowski.\nPerformance und Happening mit dem Künstler Eric Andersen.\nKonzert mit Don Cherry auf afrikanischen Instrumenten.\nAvantgarde-Jazz mit Jesper Zeuten und John Ravns Free-Jazz-Gruppe.\nKonzert mit Ballonparkens Balloner.\nVortrag und Happening mit Tom Krøjer.\nIn der kommenden Zeit wird es eine Reihe von Veranstaltungen ähnlicher Art geben."},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-tom-krojer-1-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-tom-krojer-1-0001.webp"},{"uid":"dmopn9i37ghmj5","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-tom-krojer-2-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Press Release on the First Five Days of the International Communication Event, 1 February 1977- 2/2","fr":"Peace Please. Communiqué de presse sur les cinq premiers jours de la manifestation internationale sur la communication, 1er février 1977 – 2/2","de":"Peace Please. Pressemitteilung zu den ersten fünf Tagen der internationalen Kommunikationsveranstaltung, 1. Februar 1977 – 2/2"},"text":{"en":"international communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex number\nNo. 15379 peace Dk.\n2\nThese events will be announced continuously.\nThe motto and purpose of this exhibition, “peace please,” are a bringing to life of communication between people across absurd national borders.\nThe role of art in international communication has been, and remains, central.\nThe purpose of this exhibition experiment is to realize the principles of the Helsinki Accords concerning the free exchange of ideas and cultural and artistic expressions. It will be carried out by people who have the courage to base themselves on trust in their fellow human beings.\nTo achieve this, we use modern electronic technology and with it seek to build up art’s timeless and all-embracing working force, which is peaceful coexistence.\nHuset’s exhibitions\nand Tom Krøjer\nEnclosed is a list of the participating artists.","fr":"international communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nNuméro de télex\nN° 15379 peace Dk.\n2\nCes événements seront annoncés progressivement.\nLa devise et le but de cette exposition « peace please » sont une mise en vie de la communication entre les êtres humains à travers les absurdes frontières nationales.\nLe rôle de l’art dans la communication internationale a été, et demeure, central.\nCette expérience d’exposition a pour but de concrétiser les principes des accords d’Helsinki sur le libre échange des idées et des expressions culturelles et artistiques. Elle sera réalisée par des personnes qui ont le courage de se fonder sur la confiance en leurs semblables.\nPour atteindre cet objectif, nous utilisons la technologie électronique moderne et voulons ainsi construire la force de travail intemporelle et universelle de l’art, qui est la coexistence pacifique.\nLes expositions de Huset\net Tom Krøjer\nCi-joint une liste des artistes participants.","de":"international communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex-Nummer\nNr. 15379 peace Dk.\n2\nDiese Veranstaltungen werden laufend angekündigt.\nDas Motto und der Zweck dieser Ausstellung „peace please“ sind eine Verlebendigung der Kommunikation zwischen Menschen über die absurden nationalen Grenzen hinweg.\nDie Rolle der Kunst in der internationalen Kommunikation war und ist zentral.\nDieses Ausstellungsexperiment hat das Ziel, die Prinzipien der Helsinki-Abkommen über den freien Austausch von Ideen und kulturellen sowie künstlerischen Ausdrucksformen zu verwirklichen. Es wird von Menschen realisiert werden, die den Mut haben, sich auf das Vertrauen in den Mitmenschen zu gründen.\nUm dies zu erreichen, verwenden wir die moderne elektronische Technologie und wollen damit die zeitlose und allumfassende Arbeitskraft der Kunst aufbauen, die in der friedlichen Koexistenz besteht.\nHusets Ausstellungen\nund Tom Krøjer\nBeigefügt ist eine Liste der teilnehmenden Künstler."},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-tom-krojer-2-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-tom-krojer-2-0001.webp"},{"uid":"dmopn9i37r7y6w","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-tom-krojer-jean-sellem-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Telex. please, to mr. smoker","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-tom-krojer-jean-sellem-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-tom-krojer-jean-sellem-0001.webp"},{"uid":"dmopn9i37ulgc3","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-photo-per-otto-larsen-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Jens Jørgen Thorsen. Photograph by Per Otto Larsen","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-photo-per-otto-larsen-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-photo-per-otto-larsen-0001.webp"},{"uid":"dmopn9i37wtzn0","kind":"before","file lg7tbk","kind":"telex","filename":"27-1-10-2-1977-peace-please-international-communication-unknown-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/telex/pages/27-1-10-2-1977-peace-please-international-communication-unknown-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/telex/originals/27-1-10-2-1977-peace-please-international-communication-unknown-0001.webp"}],"press":[{"uid":"dmopnamhg74vn3","kind":"press","filename":"27-1-10-2-1977-peace-please-international-communication-06-02-1977-press-coverage-0005.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"KvP 06.02.1977","fr":"KvP 06.02.1977","de":"KvP 06.02.1977"},"text":{"en":"\u003ch3>Freedom of thought is exhibited via telex machine!\u003c/h3>\n\n\u003cp>\u003cstrong>COPENHAGEN (KvP)\u003c/strong> The almost incredibly inventive Galerie St Petri in Lund has taken the initiative for an unusual exhibition whose theme is the preservation of peace. The exhibition, called International Communication Event, has been moved to Copenhagen, to the radical and controversial Huset at Magstræde 14, near Strøget.\u003c/p>\n\n\u003cp>In short, one can say that the purpose of the exhibition is to unite, across all borders, people who work for peace and for the freedom of thought and culture. It is addressed primarily to artists, writers and scientists, people who, through their work, have the possibility of influencing public opinion and thereby, in the longer term, of getting all states to fulfil the agreements of the Helsinki Accord.\u003c/p>\n\n\u003ch4>Telex “blackboard”\u003c/h4>\n\n\u003cp>How does one make an exhibition on this theme? By using modern technology. People all over the world can send messages by telex — no. 15379 Peace DK — to Huset in Copenhagen. Perhaps this cannot have any immediate effect on the preservation of peace and freedom. But the knowledge that many people want and dare to work for this purpose is important. It creates a sense of community that is necessary so that one does not become discouraged, and that can spread to others.\u003c/p>\n\n\u003cp>As the telex messages come in, they are put up in the exhibition. It started out essentially empty, apart from some smaller material by the artist Tom Krøjer that had been put up from the beginning. Krøjer has, among other things, made a metal strip with magnetically attached texts. These movable texts are meant to activate the visitors, who also have the possibility of taking part in a videotape with music by Leo Nilsson. The recording was made at Huset for this purpose.\u003c/p>\n\n\u003ch4>Art\u003c/h4>\n\n\u003cp>Art that emphasizes the idea at the expense of execution has in our time been given the name conceptual art. This exhibition, which consists mostly of written, important messages, can rightly be called a conceptual exhibition. But unlike other conceptual art, what matters here is not that the idea itself is more important than its realization.\u003c/p>\n\n\u003cp>A “traditional” conceptual artist may say, for example: here is an amusing idea for a sculpture to live in. You will enjoy it just as much as you would if it existed on paper. But if you absolutely want to see it carried out, then turn to a blacksmith and a carpenter.\u003c/p>\n\n\u003cp>The idea of peace and freedom of thought, however, must also be carried out in reality!\u003c/p>\n\n\u003cp>GUNNAR BRÅHAMMAR\u003c/p>","fr":"\u003ch3>La liberté de pensée s’expose par appareil télex !\u003c/h3>\n\n\u003cp>\u003cstrong>COPENHAGUE (KvP)\u003c/strong> La Galerie St Petri de Lund, presque incroyablement riche en idées, a pris l’initiative d’une exposition inhabituelle dont le thème est la préservation de la paix. L’exposition, intitulée International Communication Event, a été transférée à Copenhague, dans le Huset, lieu radical et controversé situé Magstræde 14, près de Strøget.\u003c/p>\n\n\u003cp>En bref, on peut dire que le but de l’exposition est d’unir, par-delà toutes les frontières, des personnes qui œuvrent pour la paix ainsi que pour la liberté de la pensée et de la culture. Elle s’adresse en premier lieu aux artistes, aux écrivains et aux scientifiques, à des personnes qui, par leur activité, ont la possibilité d’influencer l’opinion publique et, ainsi, à plus long terme, d’amener tous les États à respecter les accords de l’Acte d’Helsinki.\u003c/p>\n\n\u003cp>« Tableau » télex\u003cbr>Comment fait-on une exposition sur un tel thème ? En utilisant la technique moderne. Des personnes du monde entier peuvent envoyer par télex — n° 15379 Peace DK — des messages au Huset à Copenhague. Peut-être cela ne peut-il pas avoir d’effet direct sur la préservation de la paix et de la liberté. Mais il est important de savoir que de nombreuses personnes veulent et osent travailler dans ce but. Cela crée un sentiment de communauté, nécessaire pour ne pas se décourager, et qui peut se transmettre à d’autres.\u003c/p>\n\n\u003cp>Au fur et à mesure que les messages télex arrivent, ils sont affichés dans l’exposition. Celle-ci a commencé presque vide, à l’exception d’un matériel plus restreint de l’artiste Tom Krøjer, installé dès le début. Krøjer a notamment réalisé une bande métallique avec des textes fixés magnétiquement. Ces textes mobiles doivent activer les visiteurs, qui ont également la possibilité de participer à une bande vidéo avec une musique de Leo Nilsson. L’enregistrement a été réalisé au Huset à cette fin.\u003c/p>\n\n\u003cp>Art\u003cbr>L’art qui met l’accent sur l’idée aux dépens de l’exécution a reçu de nos jours le nom d’art conceptuel. Cette exposition, qui contient principalement des messages écrits importants, peut à juste titre être appelée une exposition conceptuelle. Mais, à la différence d’autres formes d’art conceptuel, il ne s’agit pas ici de considérer que l’idée elle-même est plus importante que sa réalisation.\u003c/p>\n\n\u003cp>Un artiste conceptuel « traditionnel » peut par exemple dire : voici une idée amusante pour une sculpture dans laquelle on pourrait habiter. Vous en tirerez autant de plaisir que si elle existait sur le papier. Mais si vous voulez absolument la voir réalisée, adressez-vous alors à un forgeron et à un charpentier.\u003c/p>\n\n\u003cp>L’idée de paix et de liberté de pensée doit cependant, elle aussi, être réalisée dans la réalité !\u003c/p>\n\n\u003cp>GUNNAR BRÅHAMMAR\u003c/p>","de":"\u003ch3>Die Freiheit des Denkens wird über den Telexapparat ausgestellt!\u003c/h3>\n\n\u003cp>\u003cstrong>KOPENHAGEN (KvP)\u003c/strong> Die fast unglaublich ideenreiche Galerie St Petri in Lund hat die Initiative zu einer ungewöhnlichen Ausstellung ergriffen, deren Thema die Bewahrung des Friedens ist. Die Ausstellung, die International Communication Event heißt, ist nach Kopenhagen verlegt worden, in das radikale und kontroverse Huset in der Magstræde 14, nahe Strøget.\u003c/p>\n\n\u003cp>Kurz gesagt kann man sagen, dass das Ziel der Ausstellung darin besteht, über alle Grenzen hinweg Menschen zu vereinen, die sich für den Frieden und für die Freiheit des Denkens und der Kultur einsetzen. In erster Linie wendet man sich an Künstler, Schriftsteller und Wissenschaftler, an Menschen, die durch ihre Tätigkeit die Möglichkeit haben, die öffentliche Meinung zu beeinflussen und dadurch längerfristig alle Staaten dazu zu bringen, die Vereinbarungen des Helsinki-Abkommens zu erfüllen.\u003c/p>\n\n\u003cp>Telex-„Tafel“\u003cbr>Wie macht man eine Ausstellung zu diesem Thema? Nun, indem man die moderne Technik nutzt. Menschen überall auf der Welt können per Telex — Nr. 15379 Peace DK — Mitteilungen an Huset in Kopenhagen schicken. Vielleicht kann dies keine unmittelbare Wirkung auf die Bewahrung des Friedens und der Freiheit haben. Aber das Wissen, dass viele Menschen für dieses Ziel arbeiten wollen und es wagen, ist wichtig. Es erzeugt ein Gefühl der Gemeinschaft, das notwendig ist, damit man nicht mutlos wird und das sich auf andere ausbreiten kann.\u003c/p>\n\n\u003cp>Sobald die Telexbotschaften eingehen, werden sie in der Ausstellung angebracht. Sie begann im Wesentlichen leer, abgesehen von etwas kleinerem Material des Künstlers Tom Krøjer, das von Anfang an aufgehängt war. Krøjer hat unter anderem ein Metallband mit magnetisch befestigten Texten ausgeführt. Diese verschiebbaren Texte sollen die Besucher aktivieren, die außerdem die Möglichkeit haben, an einem Videoband mit Musik von Leo Nilsson teilzunehmen. Die Aufnahme wurde im Huset zu diesem Zweck gemacht.\u003c/p>\n\n\u003cp>Kunst\u003cbr>Kunst, die die Idee auf Kosten der Ausführung betont, hat in unseren Tagen den Namen Konzeptkunst erhalten. Diese Ausstellung, die vor allem aus schriftlichen, wichtigen Mitteilungen besteht, kann zu Recht als Konzeptausstellung bezeichnet werden. Aber im Unterschied zu anderer Konzeptkunst geht es hier nicht darum, dass die Idee selbst wichtiger wäre als ihre Durchführung.\u003c/p>\n\n\u003cp>Ein „traditioneller“ Konzeptkünstler kann zum Beispiel sagen: Hier haben Sie eine lustige Idee für eine Skulptur, in der man wohnen kann. Daran haben Sie ebenso viel Freude, wie wenn sie auf dem Papier existiert. Aber wenn Sie sie unbedingt ausgeführt sehen wollen, dann wenden Sie sich an einen Schmied und einen Zimmermann.\u003c/p>\n\n\u003cp>Die Idee von Frieden und Freiheit des Denkens muss jedoch auch in der Wirklichkeit durchgeführt werden!\u003c/p>\n\n\u003cp>GUNNAR BRÅHAMMAR\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/pages/27-1-10-2-1977-peace-please-international-communication-06-02-1977-press-coverage-0005.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/originals/27-1-10-2-1977-peace-please-international-communication-06-02-1977-press-coverage-0005.webp"},{"uid":"dmopnamhgtzey1","kind":"press","filename":"27-1-10-2-1977-peace-please-international-communication-26-12-1976-press-coverage-0002.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"KvP 26.12.1976","fr":"KvP 26.12.1976","de":"KvP 26.12.1976"},"text":{"en":"\u003cp>The artist \u003cstrong>Tom Krøjer\u003c/strong> and the enthusiasts behind Galerie St Petri in Lund are planning an international happening at the end of January — beginning of February next year.\u003c/p>\n\n\u003cp>For the first time, telex machines will be used for an artistic purpose. Through these machines, artists all over the world will be able to exchange thoughts on how peace can be preserved.\u003c/p>\n\n\u003cp>Between 1945 and 1975, the world was “struck” by 119 wars, according to SIPRI in Stockholm — and the happening artists now intend to do something about it…\u003c/p>","fr":"\u003cp>L’artiste \u003cstrong>Tom Krøjer\u003c/strong> et les enthousiastes autour de la Galerie St Petri à Lund préparent un happening international à la fin janvier — début février de l’année prochaine.\u003c/p>\n\n\u003cp>Pour la première fois, des appareils télex seront utilisés à des fins artistiques. Grâce à ces appareils, des artistes du monde entier pourront échanger des réflexions sur la manière de préserver la paix.\u003c/p>\n\n\u003cp>Entre 1945 et 1975, le monde a été « frappé » par 119 guerres, selon le SIPRI à Stockholm — et les artistes du happening entendent maintenant faire quelque chose à ce sujet…\u003c/p>","de":"\u003cp>Der Künstler \u003cstrong>Tom Krøjer\u003c/strong> und die Enthusiasten hinter der Galerie St Petri in Lund planen ein internationales Happening Ende Januar — Anfang Februar nächsten Jahres.\u003c/p>\n\n\u003cp>Zum ersten Mal sollen Telexgeräte zu einem künstlerischen Zweck eingesetzt werden. Über diese Geräte können Künstlerinnen und Künstler aus der ganzen Welt Gedanken darüber austauschen, wie der Frieden bewahrt werden kann.\u003c/p>\n\n\u003cp>Zwischen 1945 und 1975 wurde die Welt laut dem SIPRI in Stockholm von 119 Kriegen „heimgesucht“ — und dagegen wollen die Happening-Künstler nun etwas unternehmen…\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/pages/27-1-10-2-1977-peace-please-international-communication-26-12-1976-press-coverage-0002.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/originals/27-1-10-2-1977-peace-please-international-communication-26-12-1976-press-coverage-0002.webp"},{"uid":"dmopnamhgfmaiw","kind":"press","filename":"27-1-10-2-1977-peace-please-international-communication-27-01-1977-press-coverage-0006.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"SKÅNSKA DAGBLADET 27.01.1977","fr":"SKÅNSKA DAGBLADET 27.01.1977","de":"SKÅNSKA DAGBLADET 27.01.1977"},"text":{"en":"\u003ch3>Peace please: peace game in Copenhagen\u003c/h3>\n\n\u003cp>Galerie S:t Petri in Lund has temporarily moved across the Sound to Copenhagen. There, the gallery owner Jean Sellem is organizing a peace game together with the Danish artist and lyricist Tom Krøjer.\u003c/p>\n\n\u003cp>Artists from all over the world have been invited to take part in the peace game. Through telex and a device that converts telephone signals into images, the artists participate in the game. Ideas, poems, photographs and images are to flow into the centre of the game: Huset at Magstræde 14.\u003c/p>\n\n\u003cp>The idea is that artists from different countries will present their ideas about peace, conflicts and armament.\u003c/p>\n\n\u003ch4>Economy in crisis\u003c/h4>\n\n\u003cp>At Huset in Magstræde, an exhibition is also being organized, partly designed by economists. The theme of the exhibition is “The Crisis of the Economy and the Imagination”.\u003c/p>\n\n\u003cp>“Peace Please” is the collective name for the activities taking place during the period 27 January–10 February.\u003c/p>\n\n\u003ch4>Peace concert\u003c/h4>\n\n\u003cp>The event begins today, Thursday, with a “peace concert”. It is a collection of saxophone music played in a pedestrian street in central Copenhagen.\u003c/p>\n\n\u003cp>Later in the evening, the musician Don Cherry will perform.\u003c/p>\n\n\u003cp>There will also be music on Saturday, when the Swedish electronic musician Leo Nilsson performs with a synthesizer together with Gunnar Nilsson on bass, Arne Olsson on trumpet, Bo Ingvar Olsson on violin, and Tom Krøjer on trumpet.\u003c/p>\n\n\u003cp>During the next few days, films, happenings and art lectures will also be offered.\u003c/p>\n\n\u003cp>Anyone wishing to take part in the peace game should come to Magstræde 14 via telex 15379 Peace OK. The telephone number is 01-14 26 65.\u003c/p>\n\n\u003cp>\u003cstrong>ROLF LJUNG\u003c/strong>\u003c/p>","fr":"\u003ch3>Peace please : jeu de paix à Copenhague\u003c/h3>\n\n\u003cp>La Galerie S:t Petri de Lund a temporairement déménagé de Sundet à Copenhague. Là, le galeriste Jean Sellem organise un jeu de paix avec l’artiste et parolier danois Tom Krøjer.\u003c/p>\n\n\u003cp>Des artistes du monde entier ont été invités à participer au jeu de paix. Grâce au télex et à un appareil qui convertit les signaux téléphoniques en image, les artistes participent au jeu. Des idées, des poèmes, des photographies et des images doivent affluer au centre du jeu : le Huset, situé Magstræde 14.\u003c/p>\n\n\u003cp>L’idée est que des artistes de différents pays présentent leurs idées sur la paix, les conflits et l’armement.\u003c/p>\n\n\u003ch4>Économie en crise\u003c/h4>\n\n\u003cp>Au Huset, à Magstræde, une exposition est également organisée, partiellement conçue par des économistes. Le thème de l’exposition est « La crise de l’économie et de l’imagination ».\u003c/p>\n\n\u003cp>« Peace Please » est le nom collectif des activités qui se déroulent pendant la période du 27 janvier au 10 février.\u003c/p>\n\n\u003ch4>Concert pour la paix\u003c/h4>\n\n\u003cp>La manifestation commence aujourd’hui, jeudi, par un « concert pour la paix ». Il s’agit d’un ensemble de musiques saxophones jouées dans une rue piétonne du centre de Copenhague.\u003c/p>\n\n\u003cp>Plus tard dans la soirée se produit le musicien Don Cherry.\u003c/p>\n\n\u003cp>Le samedi également, il y aura de la musique, lorsque le musicien électronique suédois Leo Nilsson se produira avec un synthétiseur, accompagné de Gunnar Nilsson à la basse, Arne Olsson à la trompette, Bo Ingvar Olsson au violon, et Tom Krøjer à la trompette.\u003c/p>\n\n\u003cp>Au cours des prochains jours, des films, des happenings et des conférences artistiques seront également proposés.\u003c/p>\n\n\u003cp>Quiconque souhaite participer au jeu de paix se rendra au Magstræde 14 par télex 15379 Peace OK. Le numéro de téléphone est 01-14 26 65.\u003c/p>\n\n\u003cp>\u003cstrong>ROLF LJUNG\u003c/strong>\u003c/p>","de":"\u003ch3>Peace please: Friedensspiel in Kopenhagen\u003c/h3>\n\n\u003cp>Die Galerie S:t Petri in Lund ist vorübergehend über den Sund nach Kopenhagen umgezogen. Dort veranstaltet der Galerist Jean Sellem zusammen mit dem dänischen Künstler und Liedtexter Tom Krøjer ein Friedensspiel.\u003c/p>\n\n\u003cp>Künstler aus der ganzen Welt sind eingeladen worden, an dem Friedensspiel teilzunehmen. Über Telex und ein Gerät, das Telefonsignale in Bilder umwandelt, nehmen die Künstler an dem Spiel teil. Ideen, Gedichte, Fotografien und Bilder sollen in das Zentrum des Spiels strömen: das Huset in der Magstræde 14.\u003c/p>\n\n\u003cp>Die Idee ist, dass Künstler aus verschiedenen Ländern ihre Gedanken über Frieden, Konflikte und Aufrüstung vorbringen.\u003c/p>\n\n\u003ch4>Wirtschaft in der Krise\u003c/h4>\n\n\u003cp>Im Huset in der Magstræde wird außerdem eine Ausstellung organisiert, die teilweise von Ökonomen gestaltet wurde. Das Thema der Ausstellung lautet „Die Krise der Ökonomie und der Vorstellungskraft“.\u003c/p>\n\n\u003cp>„Peace Please“ ist der Sammelname für die Aktivitäten, die in der Zeit vom 27. Januar bis zum 10. Februar stattfinden.\u003c/p>\n\n\u003ch4>Friedenskonzert\u003c/h4>\n\n\u003cp>Die Veranstaltung beginnt heute, Donnerstag, mit einem „Friedenskonzert“. Es handelt sich um eine Sammlung von Saxophonstücken, die in einer Fußgängerzone im Zentrum Kopenhagens gespielt werden.\u003c/p>\n\n\u003cp>Später am Abend tritt der Musiker Don Cherry auf.\u003c/p>\n\n\u003cp>Auch am Samstag gibt es Musik, wenn der schwedische Elektronikmusiker Leo Nilsson mit einem Synthesizer auftritt, zusammen mit Gunnar Nilsson am Bass, Arne Olsson an der Trompete, Bo Ingvar Olsson an der Violine und Tom Krøjer an der Trompete.\u003c/p>\n\n\u003cp>In den nächsten Tagen werden außerdem Filme, Happenings und Kunstvorträge angeboten.\u003c/p>\n\n\u003cp>Wer am Friedensspiel teilnehmen möchte, kommt in die Magstræde 14 per Telex 15379 Peace OK. Die Telefonnummer lautet 01-14 26 65.\u003c/p>\n\n\u003cp>\u003cstrong>ROLF LJUNG\u003c/strong>\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/pages/27-1-10-2-1977-peace-please-international-communication-27-01-1977-press-coverage-0006.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/originals/27-1-10-2-1977-peace-please-international-communication-27-01-1977-press-coverage-0006.webp"},{"uid":"dmopnamhgywobf","kind":"press","filename":"27-1-10-2-1977-peace-please-international-communication-31-01-1977-press-coverage-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"LUNDABLADET 31.01.1977","fr":"LUNDABLADET 31.01.1977","de":"LUNDABLADET 31.01.1977"},"text":{"en":"\u003ch3>Did the peace appeal provoke?\u003c/h3>\n\n\u003cp>\u003cstrong>LUND\u003c/strong> — The large window was completely smashed when I arrived at Galerie S:t Petri in the afternoon, Marie Sjöberg said on Sunday afternoon.\u003c/p>\n\n\u003cp>Witnesses said that a loud crash had been heard in the middle of the night, but no one had been seen.\u003c/p>\n\n\u003cp>— This is quite strange, says Marie.\u003c/p>\n\n\u003cp>— Right now the gallery is closed here in Lund for an exhibition in Copenhagen called \u003cem>Peace Please\u003c/em>. And then something like this happens.\u003c/p>\n\n\u003cp>It is the first time that Galerie S:t Petri has been subjected to such an attack.\u003c/p>\n\n\u003cp>A new pane costs just over 1,500 kronor!\u003c/p>","fr":"\u003ch3>L’appel à la paix a-t-il provoqué ?\u003c/h3>\n\n\u003cp>\u003cstrong>LUND\u003c/strong> — La grande vitrine était complètement brisée lorsque je suis arrivée à la Galerie S:t Petri dans l’après-midi, a raconté Marie Sjöberg dimanche après-midi.\u003c/p>\n\n\u003cp>Des témoins ont indiqué qu’un grand fracas avait été entendu au milieu de la nuit, mais personne n’avait été aperçu.\u003c/p>\n\n\u003cp>— C’est assez étrange, dit Marie.\u003c/p>\n\n\u003cp>— En ce moment, la galerie est fermée ici à Lund pour une exposition à Copenhague intitulée \u003cem>Peace Please\u003c/em>. Et voilà qu’une chose pareille se produit.\u003c/p>\n\n\u003cp>C’est la première fois que la Galerie S:t Petri subit une telle attaque.\u003c/p>\n\n\u003cp>Une nouvelle vitre coûte plus de 1 500 couronnes !\u003c/p>","de":"\u003ch3>Hat der Friedensappell provoziert?\u003c/h3>\n\n\u003cp>\u003cstrong>LUND\u003c/strong> — Das große Fenster war vollständig eingeschlagen, als ich am Nachmittag zur Galerie S:t Petri kam, berichtete Marie Sjöberg am Sonntagnachmittag.\u003c/p>\n\n\u003cp>Zeugen erzählten, dass mitten in der Nacht ein lauter Knall zu hören gewesen sei, aber niemand gesehen worden sei.\u003c/p>\n\n\u003cp>— Das ist ziemlich merkwürdig, sagt Marie.\u003c/p>\n\n\u003cp>— Zurzeit ist die Galerie hier in Lund wegen einer Ausstellung in Kopenhagen geschlossen, die den Namen \u003cem>Peace Please\u003c/em> trägt. Und dann geschieht so etwas.\u003c/p>\n\n\u003cp>Es ist das erste Mal, dass die Galerie S:t Petri einem solchen Angriff ausgesetzt ist.\u003c/p>\n\n\u003cp>Eine neue Scheibe kostet gut 1.500 Kronen!\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/pages/27-1-10-2-1977-peace-please-international-communication-31-01-1977-press-coverage-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/originals/27-1-10-2-1977-peace-please-international-communication-31-01-1977-press-coverage-0001.webp"},{"uid":"dmopnamhgwfscw","kind":"press","filename":"27-1-10-2-1977-peace-please-international-communication-31-01-1977-press-coverage-0004.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"SYDSVENSKA DAGBLADET SNÄLLPOSTEN 31.01.1977","fr":"SYDSVENSKA DAGBLADET SNÄLLPOSTEN 31.01.1977","de":"SYDSVENSKA DAGBLADET SNÄLLPOSTEN 31.01.1977"},"text":{"en":"\u003ch3>Gallery window smashed\u003c/h3>\n\n\u003cp>Galerie S:t Petri has existed in Lund for five and a half years. During that time, the gallery has had several provocative exhibitions. But no vandalism had occurred. Now the gallery is advertising an exhibition about peace taking place in Copenhagen. Then it happens — one of the two large windows is smashed. Right next to the damage are the words: \u003cem>Peace, please\u003c/em>.\u003c/p>\n\n\u003cp>Nothing was stolen from the gallery — it was empty except for peace posters.\u003c/p>","fr":"\u003ch3>Une vitrine de la galerie brisée\u003c/h3>\n\n\u003cp>La Galerie S:t Petri existe depuis cinq ans et demi à Lund. Pendant cette période, la galerie a présenté plusieurs expositions provocatrices. Mais aucun acte de vandalisme n’avait eu lieu. Maintenant, la galerie fait la publicité d’une exposition sur la paix qui se tient à Copenhague. C’est alors que cela se produit — l’une des deux grandes vitrines est brisée. Juste à côté des dégâts, on peut lire : \u003cem>Peace, please\u003c/em>.\u003c/p>\n\n\u003cp>Rien n’a été volé dans la galerie — elle était vide, à l’exception d’affiches pour la paix.\u003c/p>","de":"\u003ch3>Galeriefenster eingeschlagen\u003c/h3>\n\n\u003cp>Die Galerie S:t Petri besteht seit fünfeinhalb Jahren in Lund. In dieser Zeit hat die Galerie mehrere provokative Ausstellungen gezeigt. Doch zu Sachbeschädigungen war es nie gekommen. Nun wirbt die Galerie für eine Ausstellung über Frieden, die in Kopenhagen stattfindet. Da geschieht es — eines der beiden großen Fenster wird eingeschlagen. Ganz in der Nähe der Beschädigung steht: \u003cem>Peace, please\u003c/em>.\u003c/p>\n\n\u003cp>In der Galerie wurde nichts gestohlen — sie war leer, abgesehen von Friedensplakaten.\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/pages/27-1-10-2-1977-peace-please-international-communication-31-01-1977-press-coverage-0004.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/originals/27-1-10-2-1977-peace-please-international-communication-31-01-1977-press-coverage-0004.webp"},{"uid":"dmopnamhghqi01","kind":"press","filename":"27-1-10-2-1977-peace-please-international-communication-press-coverage-0003.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"SKÅNSKA DAGBLADET 31.01.1977","fr":"SKÅNSKA DAGBLADET 31.01.1977","de":"SKÅNSKA DAGBLADET 31.01.1977"},"text":{"en":"\u003ch3>The exhibition about peace aroused aggression!\u003c/h3>\n\n\u003cp>\u003cstrong>LUND\u003c/strong>: Why does an exhibition about peace provoke such warlike reactions?\u003c/p>\n\n\u003cp>That is what Marie Sjöberg at Galerie S:t Petri in Lund is wondering, after someone smashed the gallery’s display window during the weekend.\u003c/p>\n\n\u003cp>Posters about the \u003cem>Peace Please\u003c/em> event in Copenhagen had been put up in the window. The rest of the gallery was empty.\u003c/p>\n\n\u003cp>— Very strange, says Marie. This has never happened to us before, even though we have had many provocative exhibitions.\u003c/p>\n\n\u003cp>Galerie S:t Petri has, for the time being, moved its activities to Copenhagen. There, the painter, multimedia artist and poet Tom Krøjer has, in collaboration with Jean Sellem, organized the exhibition \u003cem>Peace Please\u003c/em>, which addresses economic crises, bureaucracy and acts of aggression around the world.\u003c/p>\n\n\u003ch4>Aggression\u003c/h4>\n\n\u003cp>— And an act of aggression is something we have now experienced at close range, says Marie.\u003c/p>\n\n\u003cp>The exhibition in Copenhagen, which SkD has previously reported on, also includes a communication and peace game in which artists from all over the world have been invited to collaborate. During the exhibition, a telex machine can be used to send and receive poems, photographs and images.\u003c/p>\n\n\u003cp>\u003cstrong>ANDERS DAHLBECK\u003c/strong>\u003c/p>\n\n\u003cp>\u003cem>The display window smashed. It is the first time this has happened to us, says Marie Sjöberg at Galerie S:t Petri.\u003c/em>\u003c/p>","fr":"\u003ch3>L’exposition sur la paix a suscité l’agression !\u003c/h3>\n\n\u003cp>\u003cstrong>LUND\u003c/strong> : Pourquoi une exposition sur la paix suscite-t-elle des réactions aussi guerrières ?\u003c/p>\n\n\u003cp>C’est ce que se demande Marie Sjöberg, de la Galerie S:t Petri à Lund, depuis que quelqu’un a brisé la vitrine de la galerie pendant le week-end.\u003c/p>\n\n\u003cp>Sur la vitrine avaient été affichées des affiches concernant la manifestation \u003cem>Peace Please\u003c/em> à Copenhague. Le reste de la galerie était vide.\u003c/p>\n\n\u003cp>— C’est très étrange, dit Marie. Cela ne nous était jamais arrivé auparavant, bien que nous ayons eu de nombreuses expositions provocatrices.\u003c/p>\n\n\u003cp>La Galerie S:t Petri a, pour le moment, déplacé ses activités à Copenhague. Là, le peintre, artiste multimédia et poète Tom Krøjer a organisé, en collaboration avec Jean Sellem, l’exposition \u003cem>Peace Please\u003c/em>, qui aborde les crises économiques, la bureaucratie et les actes d’agression à travers le monde.\u003c/p>\n\n\u003ch4>Agression\u003c/h4>\n\n\u003cp>— Et un acte d’agression, nous venons justement d’en faire l’expérience de près, dit Marie.\u003c/p>\n\n\u003cp>L’exposition à Copenhague, dont SkD a déjà parlé, comprend également un jeu de communication et de paix dans lequel des artistes du monde entier ont été invités à collaborer. Pendant la durée de l’exposition, un appareil télex peut être utilisé pour envoyer et recevoir des poèmes, des photographies et des images.\u003c/p>\n\n\u003cp>\u003cstrong>ANDERS DAHLBECK\u003c/strong>\u003c/p>\n\n\u003cp>\u003cem>La vitrine brisée. C’est la première fois que cela nous arrive, dit Marie Sjöberg à la Galerie S:t Petri.\u003c/em>\u003c/p>","de":"\u003ch3>Die Ausstellung über Frieden löste Aggression aus!\u003c/h3>\n\n\u003cp>\u003cstrong>LUND\u003c/strong>: Warum ruft eine Ausstellung über Frieden so kriegerische Reaktionen hervor?\u003c/p>\n\n\u003cp>Das fragt sich Marie Sjöberg von der Galerie S:t Petri in Lund, nachdem am Wochenende jemand das Schaufenster der Galerie eingeschlagen hat.\u003c/p>\n\n\u003cp>Am Fenster waren Plakate zur Veranstaltung \u003cem>Peace Please\u003c/em> in Kopenhagen angebracht. Die Galerie selbst war ansonsten leer.\u003c/p>\n\n\u003cp>— Sehr merkwürdig, sagt Marie. Das ist uns noch nie zuvor passiert, obwohl wir viele provokative Ausstellungen hatten.\u003c/p>\n\n\u003cp>Die Galerie S:t Petri hat ihre Aktivitäten vorübergehend nach Kopenhagen verlegt. Dort hat der Maler, Multimediakünstler und Lyriker Tom Krøjer in Zusammenarbeit mit Jean Sellem die Ausstellung \u003cem>Peace Please\u003c/em> organisiert, die sich mit Wirtschaftskrisen, Bürokratie und Aggressionshandlungen in aller Welt befasst.\u003c/p>\n\n\u003ch4>Aggression\u003c/h4>\n\n\u003cp>— Und eine Aggressionshandlung haben wir nun ja aus nächster Nähe erleben müssen, sagt Marie.\u003c/p>\n\n\u003cp>Die Ausstellung in Kopenhagen, über die SkD bereits berichtet hat, umfasst auch ein Kommunikations- und Friedensspiel, zu dem Künstler aus der ganzen Welt zur Zusammenarbeit eingeladen wurden. Während der Ausstellung kann ein Telexgerät benutzt werden, um Gedichte, Fotografien und Bilder zu senden und zu empfangen.\u003c/p>\n\n\u003cp>\u003cstrong>ANDERS DAHLBECK\u003c/strong>\u003c/p>\n\n\u003cp>\u003cem>Das Schaufenster eingeschlagen. Das ist das erste Mal, dass uns so etwas passiert ist, sagt Marie Sjöberg von der Galerie S:t Petri.\u003c/em>\u003c/p>"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/pages/27-1-10-2-1977-peace-please-international-communication-press-coverage-0003.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/press/originals/27-1-10-2-1977-peace-please-international-communication-press-coverage-0003.webp"}]};
  var leads={"en":"[[find:event-poster-1|Peace Please]] January 27–February 10, 1977 (Based on an idea by and featuring the artist Tom Krøjer) *International Communication Event Copenhagen, Denmark Telex R 153 79*\n\n- Artists: More than 80 international artists contributed to the event; peace research institutes were invited, as well as economists and researchers. The public was also invited to participate.\n\n- *Peace Please* is an international art and communication event held in Copenhagen at HUSET (the Copenhagen House of Culture), organized by Danish artist [[find:event-tom-krojer-0004|Tom Krøjer]]. Its main objective was to promote the exchange of information and knowledge across borders among artists from different countries regarding the possibilities for lasting peace.\n\n- The event was supported by an international network coordinated by the S:T Petri Gallery, which extended invitations to artists from around the world. Participants submitted their ideas, information, concepts, or works primarily via the telex system, but also through more traditional methods such as letters, parcels, telegrams, telephone calls, or films (for those who did not have access to telex). The submissions were then incorporated into the exhibition in the order in which they were received.\n\n- The telex machine set up in the exhibition space allowed visitors to exchange information, poems, ideas, and questions in real time regarding peace and contemporary crises. Fifty peace research institutes were also invited to present their materials and participate in the discussions.\n\n- A second space featured an exhibition titled *The Crisis of the Economy or That of the Imagination*, which focused on documents and projects related to armed conflicts and armaments, seeking to raise public awareness and encourage the rejection of any economic or industrial involvement in war-related production. The public was invited to discuss, modify, and expand upon the exhibition.\n\n- A daily programme of events also formed part of the exhibition. Each event was announced by a handwritten notice on typing paper, indicating the participant, the subject, the date, and the duration, and pinned to a support. The programme included performances (for example, an action with chairs by Erik Andersen), theatrical pieces (for example, *Maria Stuart* [[find:adler-maria-stuart-0001|by Bjørn Nøgaard and Lene Adler-Petersen on 03.02.77]]), concerts ([[find:don-cherry-0001|Don Cherry]]on 27.01.77), lectures (for example, [[find:kozlowski-toredrag-om-farver-0001|Jarosław Kozłowski]] s lecture on colours on 28.01.77, and [[find:tom-krojer-okonomi-0001.webp|Tom Krøjer]] ’s lecture on economics on 30.01.77), as well as film screenings (notably the documentary [[find:programme-0001|*B-52*]], on the American bombings in Vietnam, on 30.01.77).\n\n- A printed catalogue had been planned, but it could not be produced. Jean Sellem then came up with the idea of creating a non-commercial catalogue in the form of [[find:microfilm-catalogue-0001|microfilms]] gathered in an envelope, which in itself constituted the publication. The microfilms contained photographs of all the submissions received before and during the event, and exhibited at HUSET in the order in which they arrived. Thanks to the documents preserved in Jean Sellem’s archives, as well as to the microfilms, this catalogue has been reconstructed.","fr":"[[find:event-poster-1|Peace Please]]  27.01-10.02.1977 (Sur une idée et avec la participation de l’artiste Tom Krøjer) *International Communication Event Copenhagen Denmark Telex R 153 79*\n\n- Artistes : plus de 80 artistes internationaux ont contribué à l’événement, des instituts de recherche pour la paix ont été invités ainsi que des économistes, des chercheurs. Le public était également invité à interagir.\n\n- *Peace Please* est un événement artistique et de communication internationale organisé à Copenhague, à la HUSET (la Maison de la culture de Copenhague), à l’initiative de l’artiste danois [[find:event-tom-krojer-0004|Tom Krøjer]] . Son objectif principal était de favoriser l’échange d’informations et de connaissances entre artistes de différents pays, autour des possibilités d’une paix durable.\n\n- L’événement s’appuyait sur un réseau international coordonné par la Galerie S:T Petri, qui a diffusé l’invitation à des artistes du monde entier. Les participants transmettaient leurs idées, informations, concepts ou œuvres principalement via le système de télex, mais aussi par des moyens plus traditionnels tels que lettres, colis postaux, télégrammes, téléphone ou films (pour celles et ceux qui n’avaient pas accès au télex). Les communications étaient ensuite intégrées à l’exposition par ordre d’arrivée.\n\n- L’appareil de télex installé dans l’espace d’exposition permettait d’échanger en direct informations, poèmes, idées et questions autour de la paix et des crises contemporaines. Cinquante instituts de recherche pour la paix étaient également invités à présenter leurs documents et à participer aux débats.\n\n- Un deuxième espace présentait une exposition intitulée *La crise de l’économie ou celle de l’imagination*. Elle mettait l’accent sur des documents et projets relatifs aux conflits armés et à l’armement, cherchant à sensibiliser l’opinion publique et à inciter au refus de toute implication économique ou industrielle dans des productions liées à la guerre. Le public était invité à discuter, à modifier et à compléter l’exposition.\n\n- Une programmation d’événements quotidiens faisait également partie de la manifestation. Chaque événement était annoncé par une notice manuscrite sur papier machine, précisant l’intervenant, le sujet, la date et la durée, puis affichée. Le programme comprenait des performances (par exemple une action avec des chaises d’Erik Andersen), des pièces de théâtre (par exemple *Maria Stuart*, [[find:adler-maria-stuart-0001|par Bjørn Nøgaard et Lene Adler-Petersen le 03.02.77]]), des concerts ([[find:don-cherry-0001|Don Cherry]] , le 27.01.77), des conférences (par exemple celle de [[find:kozlowski-toredrag-om-farver-0001|Jarosław Kozłowski]] sur les couleurs, le 28.01.77, et celle de [[find:tom-krojer-okonomi-0001.webp|Tom Krøjer]] sur l’économie, le 30.01.77), ainsi que des projections de films (notamment le documentaire [[find:programme-0001|*B-52*]], sur les bombardements américains au Vietnam, le 30.01.77).\n\n- Un catalogue papier avait été prévu, mais il n’a pas pu être conçu. Jean Sellem a alors eu l’idée de produire un catalogue non commercial sous forme de [[find:microfilm-catalogue-0001|microfilms]] rassemblés dans une enveloppe, qui constituait en elle-même la publication. Les microfilms contenaient des photographies de tous les envois reçus avant et pendant l’événement, et exposés à la HUSET dans leur ordre de réception. Grâce aux documents conservés dans les archives de Jean Sellem et aux microfilms, ce catalogue a pu être reconstitué.","de":"[[find:event-poster-1|Peace Please]] 27.01–10.02.1977 (Nach einer Idee und unter Mitwirkung des Künstlers Tom Krøjer) *International Communication Event Copenhagen Denmark Telex R 153 79*\n\n- Künstler:innen: Mehr als 80 internationale Künstler:innen trugen zu der Veranstaltung bei. Eingeladen waren außerdem Friedensforschungsinstitute sowie Ökonom:innen und Wissenschaftler:innen. Auch das Publikum war eingeladen, mit der Veranstaltung zu interagieren.\n\n- *Peace Please* ist eine internationale Kunst- und Kommunikationsveranstaltung, die in Kopenhagen im HUSET (dem Kulturhaus Kopenhagens) auf Initiative des dänischen Künstlers [[find:event-tom-krojer-0004|Tom Krøjer]] organisiert wurde. Ihr Hauptziel war es, den Austausch von Informationen und Wissen zwischen Künstler:innen aus verschiedenen Ländern zu fördern, im Hinblick auf die Möglichkeiten eines dauerhaften Friedens.\n\n- Die Veranstaltung stützte sich auf ein internationales Netzwerk, das von der Galerie S:t Petri koordiniert wurde und die Einladung an Künstler:innen in aller Welt verbreitete. Die Teilnehmenden übermittelten ihre Ideen, Informationen, Konzepte oder Werke hauptsächlich über das Telex-System, aber auch auf traditionelleren Wegen wie per Brief, Postsendung, Telegramm, Telefon oder Film (für jene, die keinen Zugang zu Telex hatten). Die eingehenden Mitteilungen wurden anschließend in der Reihenfolge ihres Eintreffens in die Ausstellung integriert.\n\n- Die im Ausstellungsraum installierte Telex-Maschine ermöglichte es den Besucher:innen, in Echtzeit Informationen, Gedichte, Ideen und Fragen zu Frieden und gegenwärtigen Krisen auszutauschen. Fünfzig Friedensforschungsinstitute waren zudem eingeladen, ihre Materialien vorzustellen und sich an den Diskussionen zu beteiligen.\n\n- Ein zweiter Raum beherbergte eine Ausstellung mit dem Titel *The Crisis of the Economy or That of the Imagination*, die sich auf Dokumente und Projekte zu bewaffneten Konflikten und zur Rüstungsindustrie konzentrierte. Ziel war es, das öffentliche Bewusstsein zu schärfen und zur Ablehnung jeder wirtschaftlichen oder industriellen Beteiligung an der Kriegsproduktion anzuregen. Das Publikum war eingeladen, die Ausstellung zu diskutieren, zu verändern und zu erweitern.\n\n- Ein tägliches Veranstaltungsprogramm war ebenfalls Teil der Ausstellung. Jede Veranstaltung wurde durch einen handschriftlichen Hinweis auf Schreibmaschinenpapier angekündigt, der die beteiligte Person, das Thema, das Datum und die Dauer angab und auf einem Träger befestigt war. Das Programm umfasste Performances (zum Beispiel eine Aktion mit Stühlen von Erik Andersen), Theaterstücke (zum Beispiel *Maria Stuart* [[find:adler-maria-stuart-0001| von Bjørn Nøgaard und Lene Adler-Petersen am 03.02.77]]), Konzerte ([[find:don-cherry-0001|Don Cherry]]am 27.01.77), Vorträge (zum Beispiel [[find:kozlowski-toredrag-om-farver-0001|Jarosław Kozłowski]]  Vortrag über Farben am 28.01.77 sowie [[find:tom-krojer-okonomi-0001.webp|Tom Krøjers]]  Vortrag über Ökonomie am 30.01.77) sowie Filmvorführungen (insbesondere den Dokumentarfilm [[find:programme-0001|*B-52*]] über die amerikanischen Bombardierungen in Vietnam am 30.01.77).\n\n- Ein gedruckter Katalog war vorgesehen, konnte jedoch nicht realisiert werden. Jean Sellem kam daraufhin auf die Idee, einen nicht-kommerziellen Katalog in Form von [[find:microfilm-catalogue-0001|Microfilmen]] zu produzieren, die in einem Umschlag zusammengefasst waren, der selbst die Publikation bildete. Die Mikrofilme enthielten Fotografien aller Beiträge, die vor und während der Veranstaltung eingingen und im HUSET in der Reihenfolge ihres Eingangs ausgestellt wurden. Dank der in Jean Sellems Archiv erhaltenen Dokumente sowie der Mikrofilme konnte dieser Katalog rekonstruiert werden."};

  function safeArticleHtml(html){
    html=String(html||'');
    var allowedTags=['P','BR','H3','H4','STRONG','B','EM','I','UL','OL','LI','BLOCKQUOTE'];
    var template=document.createElement('template');
    template.innerHTML=html;
    function cleanNode(node){
      Array.from(node.children).forEach(function(child){
        if(allowedTags.indexOf(child.tagName)===-1){child.replaceWith(document.createTextNode(child.textContent||''));return}
        Array.from(child.attributes).forEach(function(attr){child.removeAttribute(attr.name)});
        cleanNode(child);
      });
    }
    cleanNode(template.content);
    return template.innerHTML;
  }

  function findItemByFragment(fragment){
    fragment=String(fragment||'').trim().toLowerCase();
    if(!fragment)return null;
    var lists=[{name:'catalogue',items:data.catalogue||[]},{name:'before',items:data.before||[]},{name:'telex',items:data.telex||[]},{name:'press',items:data.press||[]}];
    for(var i=0;i<lists.length;i++){
      for(var j=0;j<lists[i].items.length;j++){
        var item=lists[i].items[j];
        if(!item)continue;
        var haystack=[item.filename||'',item.imageFilename||'',item.url||'',item.originalUrl||''].join(' ').toLowerCase();
        if(haystack.indexOf(fragment)>-1){return {item:item,section:lists[i].name,index:j}}
      }
    }
    return null;
  }

  function formatIntro(text){
    return String(text||'').split(/\n\s*\n/).map(function(block){
      block=block.trim();

    }).join('');
  }

  function renderIntroText(s){

      var parts=String(inside||'').split('|');
      if(parts.length<2)return match;
      var ref=String(parts[0]||'').trim();
      var label=String(parts.slice(1).join('|')||'').trim();
      var title=label;
      var img='';
      var caption='';
      var targetSection='';
      var targetIndex=-1;
      var m=ref.match(/^(cat|catalogue|before|documents|telex|press):(\d+)$/i);
      if(m){
        var section=m[1].toLowerCase();
        var number=parseInt(m[2],10);
        var list=null;
        if(section==='cat'||section==='catalogue'){list=data.catalogue||[];targetSection='catalogue'}
        else if(section==='before'||section==='documents'){list=data.before||[];targetSection='before'}
        else if(section==='telex'){list=data.telex||[];targetSection='telex'}
        else if(section==='press'){list=data.press||[];targetSection='press'}
        var item=list&&list[number-1];
        if(item){img=item.originalUrl||item.url||'';caption='';targetIndex=number-1}
      }
      var fm=ref.match(/^file:(.+)$/i);
      if(fm){
        var filename=fm[1].trim();
        var foundFile=findItemByFragment(filename);
        if(foundFile&&foundFile.item){img=foundFile.item.originalUrl||foundFile.item.url||'';caption='';targetSection=foundFile.section;targetIndex=foundFile.index}
      }
      var findMatch=ref.match(/^find:(.+)$/i);
      if(findMatch){
        var fragment=findMatch[1].trim();
        var found=findItemByFragment(fragment);
        if(found&&found.item){img=found.item.originalUrl||found.item.url||'';caption='';targetSection=found.section;targetIndex=found.index}
      }
      if(!img&&/^https?:\/\//i.test(ref)){img=ref;caption=parts[2]||''}
      var token='%%JSL_INTRO_REF_'+placeholders.length+'%%';
      placeholders.push({token:token,label:label,title:title,img:img,caption:caption,targetSection:targetSection,targetIndex:targetIndex});
      return token;
    });
    var html=formatIntro(protectedText);
    placeholders.forEach(function(ref){
      if(!ref.img){html=html.replace(ref.token,richText(ref.label));return}
      var button='<button type="button" class="jsl-intro-ref" data-ref-title="'+e(plainText(ref.title||ref.label))+'" data-ref-img="'+e(ref.img)+'" data-ref-caption="'+e(ref.caption)+'" data-ref-section="'+e(ref.targetSection||'')+'" data-ref-index="'+e(ref.targetIndex)+'">'+richText(ref.label)+'</button>';
      html=html.replace(ref.token,button);
    });
    return html;
  }

root.querySelector('[data-open-before]').onclick=function(){open(data.before,0)};
root.querySelector('[data-open-telex]').onclick=function(){open(data.telex,0)};
root.querySelector('[data-open-press]').onclick=function(){open(data.press,0)};
  root.querySelector('[data-toggle-artists]').onclick=function(){root.querySelector('[data-panel]').classList.toggle('is-open')};
  root.querySelector('[data-intro-toggle]').onclick=function(){var panel=root.querySelector('[data-intro-panel]');var btn=root.querySelector('[data-intro-toggle]');if(!panel||!btn)return;panel.classList.toggle('is-open');btn.classList.toggle('is-open',panel.classList.contains('is-open'))};
  root.querySelector('[data-search]').oninput=function(){var q=this.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();root.querySelectorAll('[data-artist]').forEach(function(b){var n=(b.getAttribute('data-artist')||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();b.style.display=!q||n.indexOf(q)>-1?'block':'none'})};

  overlay.querySelector('[data-prev]').onclick=function(){show(currentList,current-1)};
overlay.querySelector('[data-next]').onclick=function(){show(currentList,current+1)};
overlay.querySelector('[data-first]').onclick=function(){show(currentList,0)};

var returnDocBtn=overlay.querySelector('[data-return-doc]');
if(returnDocBtn){
  returnDocBtn.onclick=function(){
    if(returnList && returnList.length){
      var list=returnList;
      var index=returnIndex || 0;

      returnList=null;
      returnIndex=null;

      show(list,index);
    }
  };
}

overlay.querySelector('[data-reset-view]').onclick=function(){resetViewerTransform()};
overlay.querySelector('[data-rotate-left]').onclick=function(){rotation-=90;applyViewerTransform()};
overlay.querySelector('[data-rotate-right]').onclick=function(){rotation+=90;applyViewerTransform()};
overlay.querySelector('[data-toggle-image-zoom]').onclick=function(){setImageZoom(!imageZoom)};
overlay.querySelector('[data-close]').onclick=close;

if(viewerArtistsBtn){
  viewerArtistsBtn.onclick=function(){
    if(viewerArtistsPanel){
      viewerArtistsPanel.classList.toggle('is-open');
      viewerArtistsBtn.classList.toggle('is-active', viewerArtistsPanel.classList.contains('is-open'));
    }
    renderViewerControls();
  };
}

document.addEventListener('keydown',function(ev){
  if(!overlay.classList.contains('is-open'))return;
  if(ev.key==='Escape')close();
  if(ev.key==='ArrowLeft')show(currentList,current-1);
  if(ev.key==='ArrowRight')show(currentList,current+1);
});

render();
})();
</script>
