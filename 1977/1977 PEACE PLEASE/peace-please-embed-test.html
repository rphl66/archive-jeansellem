  var root=document.getElementById("jsl-peace-please-archive-v7-intro-stable");
  if(!root || root.dataset.init==='1')return;
  root.dataset.init='1';

  var data={"before":[{"uid":"dmopn9i37d7kfl","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Envelope of preparatory documents for Peace Please, sent to Jean Sellem by Tom Krøjer and Kristian Riis, 20 January 1977 - 1/8","fr":"Enveloppe contenant des documents préparatoires pour Peace Please, envoyée à Jean Sellem par Tom Krøjer et Kristian Riis, 20 janvier 1977 – 1/8","de":"Umschlag mit vorbereitenden Dokumenten für Peace Please, gesendet von Tom Krøjer und Kristian Riis an Jean Sellem, 20. Januar 1977 – 1/8"},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0001.webp"},{"uid":"dmopn9i37bb0dh","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0002.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Participant Information Sheet with Telex and Telecopy Details- Tom Krøjer and Kristian Riis 2/8","fr":"Peace Please. Fiche d’information destinée aux participants, avec détails concernant le télex et la télécopie — Tom Krøjer et Kristian Riis, 2/8","de":"Peace Please. Informationsblatt für Teilnehmende mit Angaben zu Telex und Telekopie — Tom Krøjer und Kristian Riis, 2/8"},"text":{"en":"INTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\ncat. I\nThe exhibition’s telex number is: 15379 peace DK.\nThe exhibition’s telecopy telephone number is (01) 142665.\nAll proposals and participation are welcome and are regarded as part of the exhibition.\nAt the exhibition there will be a colour video studio, which may also be used.\nThe exhibition will become a fundamentally new form of art exhibition. It will become a biologically-technical living organism, in constant change, and through its global mode of communication it will remain constantly responsive to the ideas of the new art.\nEnclosed is an attachment concerning events (provisional) in connection with the exhibition.\nYours sincerely,\nTom Krøjer and Kristian Riis\n[side printed text]\n“PEACE PLEASE” TOM KRØJER EXHIBITION LOCATION: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL 01-142665\n[bottom printed text]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL 046/14 78 00","fr":"INTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\ncat. I\nLe numéro de télex de l’exposition est : 15379 peace DK.\nLe numéro de téléphone pour la télé-copie de l’exposition est le (01) 142665.\nToutes les propositions et toutes les participations sont les bienvenues et sont considérées comme une partie de l’exposition.\nDans l’exposition, il y aura un studio vidéo couleur, qui pourra également être utilisé.\nL’exposition deviendra une forme fondamentalement nouvelle d’exposition d’art. Elle deviendra un organisme vivant biologico-technique, en constante transformation, et, par son mode global de communication, elle sera constamment sensible aux idées du nouvel art.\nCi-joint, un annexe / document joint concernant les événements (provisoires) liés à l’exposition.\nCordialement,\nTom Krøjer et Kristian Riis\n[texte imprimé latéral]\n“PEACE PLEASE” TOM KRØJER LIEU DE L’EXPOSITION : HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TÉL. 01-142665\n[texte imprimé en bas de page]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TÉL. 046/14 78 00","de":"NTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\ncat. I\nDie Telexnummer der Ausstellung lautet: 15379 peace DK.\nDie Telecopy-Telefonnummer der Ausstellung ist (01) 142665.\nAlle Vorschläge und jede Mitwirkung sind willkommen und werden als Teil der Ausstellung betrachtet.\nIn der Ausstellung wird es ein Farbvideostudio geben, das ebenfalls benutzt werden kann.\nDie Ausstellung wird eine grundlegend neue Form der Kunstausstellung werden. Sie wird zu einem biologisch-technischen lebenden Organismus, in ständiger Veränderung, und sie wird durch ihre globale Kommunikationsweise fortwährend empfindsam gegenüber den Ideen der neuen Kunst sein.\nBeigefügt ist eine Anlage über Veranstaltungen (vorläufig) im Zusammenhang mit der Ausstellung.\nMit freundlichen Grüßen\nTom Krøjer und Kristian Riis\n[seitlicher Drucktext]\n“PEACE PLEASE” TOM KRØJER AUSSTELLUNGSORT: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL. 01-142665\n[Drucktext am unteren Seitenrand]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL. 046/14 78 00"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0002.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0002.webp"},{"uid":"dmopn9i37wg1iq","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0003.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Economic Crisis Exhibition and Peace Communication Event — 3/8","fr":"Peace Please. Exposition sur la crise économique et événement de communication pour la paix — 3/8","de":"Peace Please. Ausstellung zur Wirtschaftskrise und Kommunikationsereignis für den Frieden — 3/8"},"text":{"en":"INTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\nPress release\ncat. I\nHuset Magstræde 14, 1466 Kbh K, 20 January 1977\nECONOMY-CRISIS EXHIBITION AND PEACE COMMUNICATION EVENT\nFrom 27 January to 10 February, the painter, media and multi-artist, and lyric poet Tom Krøjer, in collaboration with Jean Sellem, the “Archiv of experimental and marginal art Lund Sweden,” Danish and foreign artists, peace researchers, economists and others, is organising an exhibition and communication event at Huset in Copenhagen. In the exhibition space on the 2nd floor, a series of structures will be built that take up the economic concepts and realities fundamental to the current economic crisis. It will be possible to work with this structure during the exhibition, to alter it, discuss it and supplement it. The motto for this part of the exhibition is “The crisis of the economy or of the imagination.” A group of economists has taken part in shaping it. Around this part of the exhibition there will be discussions, lectures, conversations, etc., between artists, exhibition visitors, economists, politicians, and so on. Tom Krøjer says about this part: “Art also develops by drawing new areas of society into its sphere, and this economy exhibition will be an experiment with all the concepts, ideas and relations of political economy. I will try to make a flexible spatial sculpture with these concepts, which the public can move around and thereby take part in creating a democratically produced image of economic life.”\nThe second part of the exhibition is a “communication event and peace game.” For this part of the exhibition, in collaboration with the Archiv of experimental art in Lund, we have invited a number of communication, marginal and contemporary artists from all over the world. In the exhibition space there is a telex machine and a telephone image-transmission machine, which during the exhibition can be used to send and receive information, ideas, poems, photographs and images, questions about the conditions of peace and crisis tendencies, as well as things that the individual artists wish to communicate. The devices will be available for use during the exhibition. This is the first time telex is being used on a large scale as an artistic medium. The peace game consists in getting artists in different countries to communicate their ideas, information, concepts, etc., about the possibility of ordinary peace through the telex system. In addition to telex, traditional forms of communication such as letters, parcels, telegrams, telephone, film, video, etc., will be used. This part mainly concerns conflicts and armament. Unfortunately, these problems are not regarded as serious by the majority. Perhaps artists can help create the climate of opinion needed to make people say no to the investment of money and labour in any production that may contribute to war.\n[side printed text]\n“PEACE PLEASE” TOM KRØJER EXHIBITION LOCATION: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL 01-142665\n[bottom printed text]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL 046/14 78 00","fr":"INTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\nCommuniqué de presse\ncat. I\nHuset Magstræde 14, 1466 Kbh K, le 20 janvier 1977\nEXPOSITION-CRISE-ÉCONOMIE ET ÉVÉNEMENT DE COMMUNICATION POUR LA PAIX\nDu 27 janvier au 10 février, le peintre, artiste des médias et multimédia, ainsi que poète lyrique Tom Krøjer organise, en collaboration avec Jean Sellem, « Archiv of experimental and marginal art Lund Sweden », des artistes danois et étrangers, des chercheurs pour la paix, des économistes et d’autres encore, une exposition et un événement de communication à Huset, à Copenhague. Dans l’espace d’exposition situé au 2e étage, sera construite une série de structures prenant pour point de départ les notions et réalités économiques qui sont fondamentales pour la crise économique actuelle. Il sera possible de travailler avec cette structure pendant l’exposition, de la transformer, de la discuter et de la compléter. La devise de cette partie de l’exposition est : « La crise de l’économie ou de l’imagination ». Un groupe d’économistes a participé à son élaboration. Autour de cette partie de l’exposition auront lieu des discussions, conférences, entretiens, etc., entre artistes, visiteurs de l’exposition, économistes, hommes politiques, etc. Tom Krøjer dit à propos de cette partie : « L’art se développe aussi en intégrant de nouveaux domaines de la société dans sa sphère, et cette exposition sur l’économie sera une expérience avec tous les concepts, idées et relations de l’économie politique. Je vais essayer de créer une sculpture spatiale flexible avec ces concepts, que le public pourra déplacer, contribuant ainsi à créer une image du monde économique produite démocratiquement. »\nLa seconde partie de l’exposition est un « événement de communication et jeu de paix ». Pour cette partie de l’exposition, nous avons invité, en collaboration avec l’Archiv of experimental art à Lund, un certain nombre d’artistes de la communication, marginaux et contemporains du monde entier. Dans l’espace d’exposition ont été installés un appareil télex et une machine de transmission téléphonique d’images, qui pourront être utilisés pendant l’exposition pour envoyer et recevoir des informations, des idées, des poèmes, des photographies et des images, des questions sur les conditions de la paix et les tendances de la crise, ainsi que des choses que les différents artistes souhaitent communiquer. Les appareils pourront être utilisés durant l’exposition. C’est la première fois que le télex est utilisé à grande échelle comme médium artistique. Le jeu de paix consiste à amener des artistes de différents pays à communiquer leurs idées, informations, concepts, etc., sur la possibilité d’une paix ordinaire à travers le système de l’appareil télex. Outre le télex, des formes traditionnelles de communication comme les lettres, les colis postaux, les télégrammes, le téléphone, le film, la vidéo, etc., seront utilisées. Cette partie porte surtout sur les conflits et l’armement. Malheureusement, ces problèmes ne sont pas considérés comme graves par la majorité. Peut-être les artistes peuvent-ils contribuer à créer le climat d’opinion nécessaire pour amener les gens à dire non à l’investissement d’argent et de travail dans toute production susceptible de contribuer à la guerre.\n[texte imprimé latéral]\n« PEACE PLEASE » TOM KRØJER LIEU DE L’EXPOSITION : HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TÉL. 01-142665\n[texte imprimé en bas de page]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TÉL. 046/14 78 00","de":"Peut-être : Emmanuelle Rapin :\n\tTant mieux, tu  es prêt à déplacer des montagnes de codes. Merci j'ai bien  dormi, je me suis endormie un peu tard mais ensuite pas de plis. je bois le café que je me suis apportée toute seule. tu as salle de gym aujourd'hui ?\n\nEmma Levy :\n\tLa salle de gym est fermée aujourd’hui à cause de la DB. As tu aujourd’hui marathon?\n\nPeut-être : Emmanuelle Rapin :\n\tD'accord le prof de gym est coincé à Basel bad. je n'ai pas d'activité sportive avec les copines de ma mère aujourd'hui, cela reprend demain. Je vais essayer de faire du yoga, j'ai des courbatures de l'aquastreching d'hier.\n\nEmma Levy :\n\tTu vas avoir des courbatures pendant ton séjour chez tes parents. Qu’as tu prévu aujourd’hui?\n\nPeut-être : Emmanuelle Rapin :\n\tCe matin je vais travailler sur la présentation des archives, ensuite je ferai des courses avec ma mère, je dois trouver un cadeau pour ma nièce.\n\nEmma Levy :\n\tT’es débordée. Tu me téléphones quand tu es prête? Je suis tondu. Je vais me rincer sous la douche. \n\nPeut-être : Emmanuelle Rapin :\n\tÇa va encore j'ai eu des matinée aux activités surmultipliées, ouije te téléphone lorsque je suis  prête. Bonne preparation et bon début de bureau Raphaël .\n\nEmma Levy :\n\tMerci Emmanuelle, prépare toi bien \n\thttps://youtu.be/YzjM1b4wjTI\n\n\n\tVoilà le jeune et sa réplique 40 ans après \n\nPeut-être : Emmanuelle Rapin :\n\tLes deux me plaisent beaucoup.\n\tTu as fait quand l'œuvre de la 2eme photo ? \n\nEmma Levy :\n\til y a au moins 15-20 ans.\n\nPeut-être : Emmanuelle Rapin :\n\tTu peux faire une nouvelle version 🦉\n\n\tAvec les droits auteurs.\n\tDROITS d’AUTEUR\n\nFR — Droits d’auteur / retrait sur demande\nDroits d’auteur – Copyright – Retrait sur demandeLes documents et images mis en ligne sur ce site proviennent d’un fonds d’archives et sont publiés à des fins de recherche, documentation et information. Les droits d’auteur (copyright) et autres droits (notamment droits des artistes, des photographes, des auteurs, des éditeurs et/ou de leurs ayants droit) restent la propriété de leurs titulaires respectifs.\nNous nous efforçons, dans la mesure du possible, d’identifier les auteurs et ayants droit et d’obtenir les autorisations nécessaires. Malgré ces recherches, certaines attributions ou autorisations peuvent manquer ou être incomplètes.\nSi vous êtes titulaire de droits sur un document, ou si vous ne souhaitez pas qu’un contenu apparaisse en ligne, merci de nous contacter : nous procéderons au retrait ou à l’ajustement des informations (crédit, mention de droits, etc.) dans les meilleurs délais.\n\nEN — Copyright / takedown policy\nCopyright – rights holders – takedown policyThe documents and images published on this website come from an archival fonds and are made available for research, documentation, and informational purposes. Copyright and related rights (including rights held by artists, photographers, authors, publishers, and/or their estates) remain with their respective rights holders.\nWe make every reasonable effort to identify authors and rights holders and to obtain permissions where required. Despite these efforts, some attributions or permissions may be missing or incomplete.\nIf you are a rights holder, or if you prefer that a specific item not be displayed online, please contact us: we will remove the content or amend the relevant information (credit line, rights notice, etc.) as promptly as possible.\n\nDE — Urheberrecht / Hinweis & Entfernung auf Anfrage\nUrheberrecht – Rechteinhaber:innen – Entfernung auf AnfrageDie auf dieser Website veröffentlichten Dokumente und Abbildungen stammen aus einem Archivbestand und werden zu Zwecken der Forschung, Dokumentation und Information bereitgestellt. Urheberrechte und verwandte Schutzrechte (insbesondere Rechte von Künstler:innen, Fotograf:innen, Autor:innen, Verlagen und/oder Rechtsnachfolger:innen) verbleiben bei den jeweiligen Rechteinhaber:innen.\nWir bemühen uns nach bestem Wissen und Gewissen, Urheber:innen und Rechteinhaber:innen zu identifizieren und erforderliche Genehmigungen einzuholen. Trotz dieser Recherchen können einzelne Angaben oder Einwilligungen fehlen oder unvollständig sein.\nSollten Sie Rechte an einem Inhalt geltend machen oder nicht wünschen, dass ein bestimmtes Dokument online zugänglich ist, kontaktieren Sie uns bitte: wir werden den Inhalt zeitnah entfernen oder die Angaben entsprechend korrigieren (Credit Line, Rechtehinweis usw.).\n\n\n\n\n\n\tJe crois que c’est dedans maintenant. Je dois partir malheruesement, travaille bien\n\nEmma Levy :\n\tOui merci je regarde. Amuse toi bien.\n\tQuand tu reviens, on en discute car le document est difficile à comprendre pour moi, il y a des choses en rouge, d’autres barrées.\n\nPeut-être : Emmanuelle Rapin :\n\ten rouge ce n'est pas à reprendre c'est juste pour nous pour lire les différentes catégories, les trucs barrés se sont les brouillons donc il faut les ignorer. Mais oui on en discute plus tard \n\nEmma Levy :\n\tOui plus tard merci.\n\nPeut-être : Emmanuelle Rapin :\n\t🦉\n\nEmma Levy :\n\t🦉\n\nPeut-être : Emmanuelle Rapin :\n\n\nEmma Levy :\n\tC’est un chien comique à l’insu de son plein gré. \n\nPeut-être : Emmanuelle Rapin :\n\toui absolument \n\t\n\nEmma Levy :\n\ttrès bon \n\n\nPeut-être : Emmanuelle Rapin :\n\tl'original nt sur les traductions. je vérifie si je te l'avais fourni dans le Pages\n\tajouter \n\nEmma Levy :\n\tc’est trop bien si tu l’aimes. Il faut toujours que tu me dises quoi améliorer pour que ce soit fluide et encore plus fluide. \n\toui pour les traductions\n\nPeut-être : Emmanuelle Rapin :\n\tOui je te le dis,c'est à l'usage que je remarque les changements à faire. l'avertissement pour les trad. est bien ds le pages.\n\nEmma Levy :\n\toui c’est en l’utilisant qu’on peut voir ce qui ne va pas. D’aileurs quand on aura bien avancé, je fusionnerai Press release dans Event Archive. \n\nPeut-être : Emmanuelle Rapin :\n\tD'accord, il y aura seulement l'affiche. \n\nEmma Levy :\n\toù?\n\nPeut-être : Emmanuelle Rapin :\n\tje veux dire on verra quand même l'affiche de l'exposition quant on aura cliqué sur l'artiste ?\n\nEmma Levy :\n\toui ce sera exactement comme maintenant mais c’est en ouvrant archive de l’artiste qu’on pourra lire le press release. \n\nPeut-être : Emmanuelle Rapin :\n\tOui très bien.\n\nEmma Levy :\n\toui ca simplifiera la navigation. \n\nPeut-être : Emmanuelle Rapin :\n\tobsolument. je vais à la douche froide. à tout à l'heure Raphaël \n\nEmma Levy :\n\tA tout à l’heure Emmanuelle.\n\nPeut-être : Emmanuelle Rapin :\n\t🦉\n\n\tEst-ce que tu me trouves ?\n\nEmma Levy :\n\tla troisième en partant de la gauche? \n\nPeut-être : Emmanuelle Rapin :\n\toui, tu as vu ils ont tous mis leur écharpe du mauvais côté.\n\nEmma Levy :\n\tC’est vrai , elles sont si nulles\n\nPeut-être : Emmanuelle Rapin :\n\tils n'ont pas écouter les consignes ils devaient être dans la lune \n\nEmma Levy :\n\tIls ont probablement très mal finis. \n\nPeut-être : Emmanuelle Rapin :\n\toui c'est certain \n\tLe livre , 1983\n\n\n\n\n\n\nEmma Levy :\n\tmerci\n\nPeut-être : Emmanuelle Rapin :\n\t🦉\n\nEmma Levy :\n\tJe vais dans le panier. Es-tu encore avec tes parents? \n\nPeut-être : Emmanuelle Rapin :\n\ttu peux me téléphoner \n\tje viens de lire le mail, il cherche quelque chose qu'il ne trouvera pas. \n\tbon , tant pis si il se trompe de trace. nous avons répondu à ses questions\n\nEmma Levy :\n\toui on laisse tomber.\n\nPeut-être : Emmanuelle Rapin :\n\toui. Nous continuons notre travail.\n\nEmma Levy :\n\tOui\n\nPeut-être : Emmanuelle Rapin :\n\t🦉\n\nEmma Levy :\n\tDors bien Emmanuelle. \n\nPeut-être : Emmanuelle Rapin :\n\tmerci, toi aussi. fais de beaux rêves codés qui fonctionnent à merveille.\n\nEmma Levy :\n\tmerci, toi aussi, dors le plus tôt possible. À la synagogue, les horaires sont différents. \n\nPeut-être : Emmanuelle Rapin :\n\toui, je m'en réjouis \n\nEmma Levy :\n\tmoi aussi.\n\nPeut-être : Emmanuelle Rapin :\n\tBonjour Raphaël 🦉\n\tAs tu passé une bonne nuit ?\n\nEmma Levy :\n\tBonjour Emmanuelle, j’ai passé une longue nuit. À 5 heures j’ai voulu me levé et je me suis rendormi jusqu’à maintenant. Ta chouette me dit que tu as la\npatate. Ou pas?\n\nPeut-être : Emmanuelle Rapin :\n\tC'est bien tu as la pêche. Je suis en forme, la chouette est contente de se réveiller un peu plus tôt, j'ai ouvert les yeux à 7h30. j'en suis à mon deuxième café. je n'arrivais pas à envoyer mon message de 7h30. il n'y avait pas de connexion.\n\nEmma Levy :\n\tJe comprends. Je commence le café. Aujourd’hui je range la synagogue.\n\nPeut-être : Emmanuelle Rapin :\n\tAlors bon réveil Raphaël, à tout à l'heure.\n\nEmma Levy :\n\tMerci. Bon réveil à toi aussi. À tout à l’heure Emmanuelle. \n\nPeut-être : Emmanuelle Rapin :\n\tMerci Raphaël \n\tvoilà ils sont arrivés, c'est la fête qui commence. Travaille bien Raphaël et je le manifeste dès que les festivités sont achevées et qu'ils sont repartis. À toi à l'heure 🦉\n\nEmma Levy :\n\tBonne fête. Amuse toi bien et passe le bonjour à tous. Allez l’OM. \n\nPeut-être : Emmanuelle Rapin :\n\tmerci, je lui dit, mais il te dit que Lorient est en coupe De France et pas l'OM. voilà \n\tenfin ils y seront bientôt plus dit Gatien \n\nEmma Levy :\n\tIl a raison. \n\nPeut-être : Emmanuelle Rapin :\n\tRaphaël , est ce que tu es d'accord si je ramene une petite machine à coudre ? \n\nEmma Levy :\n\tOui bien sǔr. \n\nPeut-être : Emmanuelle Rapin :\n\tTrop bien, merci, Je vais tout recoudre du sol au plafond \n\nEmma Levy :\n\tTrès bien\n\nPeut-être : Emmanuelle Rapin :\n\tTu avances comme tu le souhaites ?\n\nEmma Levy :\n\tJe viens d’ouvrir un œil. Je vais m’y remettre . Et toi? \n\nPeut-être : Emmanuelle Rapin :\n\tnous sommes sortis du restaurant et nous allons acheter le cadeau d'anniversaire maintenant.\n\nEmma Levy :\n\tJe t’envie. \n\nPeut-être : Emmanuelle Rapin :\n\tc'est pas marrant. mais ton soutien est réconfortant \n\nEmma Levy :\n\toui\n\nPeut-être : Emmanuelle Rapin :\n\tAlors travaille bien et à plus tard Raphaël \n\nEmma Levy :\n\tÀ plus tard Emmanuelle et bonne tarte au citron. \n\thttps://www.penkararebooks.com/pages/books/55403/christian-frey-i-e-krisztian-frey/stochastic-suprematism-or-a-hungarian-painter-in-exile-turns-to-computer-art-dot-matrix-print-out\n\nPeut-être : Emmanuelle Rapin :\n\tmerci \n\t Bonjour Raphaël as tu bien dormi ? je me caféine \n\nEmma Levy :\n\tBonjour Emmanuelle, oui j’ai bien dormi. Je\nme\nsuis levé à 6 heures. Et toi?\n\nPeut-être : Emmanuelle Rapin :\n\tJe me suit levée il y a 15 mn. j'ai bien dormi avec une interruption Rantanplan \n\nEmma Levy :\n\tRantanplan l’anomalie. Encore quelques heures et tu es à Zurich. \n\nPeut-être : Emmanuelle Rapin :\n\toui \n\t🦉\n\tje suis trop contente \n\nEmma Levy :\n\tTrop bien. Je vais bientôt chez le barbier puis à la salle de gym. Je suis aussi trop content. 🤡\n\nPeut-être : Emmanuelle Rapin :\n\tJe me caféine en vitesse, bonne preparation Raphaël . À tout à l'heure \n\nEmma Levy :\n\tÀ tout à l’heure Emmanuelle. Prépare toi bien\n\nPeut-être : Emmanuelle Rapin :\n\tVoilà c'est parti et il roule vers Paris.🦉🦉🦉\n\nEmma Levy :\n\tqu’il ne s’arrête surtout pas. \n\nPeut-être : Emmanuelle Rapin :\n\toui \n\nEmma Levy :\n\ttrop bien \n\nPeut-être : Emmanuelle Rapin :\n\tJe roule, mais j’aurai 20 mn de retard car le passage à niveau abimé par l’inondation semble encore avoir des problèmes. \n\tTu savais pour cette expo de 2025 eux UK avec Jaroslaw Kozlowski\n\thttps://contemporarylynx.co.uk/artists-archives-jaroslaw-kozlowski\n\nEmma Levy :\n\tOui j’avais reçu la newsletter de la fondation:\n\thttps://fundacjaprofile.pl/\n\tC’est avec eux que j’avais organisé l’exposition de Natalia LL et Wasko\n\nPeut-être : Emmanuelle Rapin :\n\td’accord, c’est bien. J’ai remarqué ici que dans les expo de Kozlowski, il n’y avait pas mention de ces 2 expos à S:t Petri\n\thttps://www.personsprojects.com/artists/jaroslaw-kozlowski?x=cv\n\tIl faut leur écrire.\n\nEmma Levy :\n\tMalheureusement . Nous devons remettre les pendules à l’heure.\n\nPeut-être : Emmanuelle Rapin :\n\tOui encore et toujours\n\nEmma Levy :\n\tOui\n\tEmmanuelle, ça va?\n\nPeut-être : Emmanuelle Rapin :\n\tOui et toi?, J’arrive d’ici 1h15 à Paris, tout roule\n\tJe travaille sur le texte qui va révolutionner le monde de la recherche en archives\n\nEmma Levy :\n\tBonne nouvelle. Moi aussi ca roule. J’ai fait la cuisine pendant que tu t’apprêtes à révolutionner le monde de la recherche. J’ai hâte lire le texte. Je vais dans le panier, puis Concetta continuera. \n\nPeut-être : Emmanuelle Rapin :\n\tTrès bien alors repose-toi bien Raphaël , j'ai hâte d'arriver \n\nEmma Levy :\n\toui merci et oui moi aussi j’ai hâte. \n\nPeut-être : Emmanuelle Rapin :\n\t\n\nEmma Levy :\n\t🐼\n\nPeut-être : Emmanuelle Rapin :\n\tIl est toujours aussi magnifique \n\nEmma Levy :\n\tC’est le rétroviseur gauche de la voiture de ta mère. \n\nPeut-être : Emmanuelle Rapin :\n\ttrès marrant\n\tje viens de descendre du train, c'est Ibiza à Paris \n\nEmma Levy :\n\tOui ici aussi.\n\nPeut-être : Emmanuelle Rapin :\n\tvoilà gare de Lyon maintenant, je m'approche \n\nEmma Levy :\n\ttu vas faire quoi à la gare pendant plus d’une heure? \n\nPeut-être : Emmanuelle Rapin :\n\tJe mange une salade et je bois un café dans un espace de coworking, je peux re eras alors tes rhizomes. \n\nPeut-être : Emmanuelle Rapin :\n\n\tP.7 en rouge. Je croise cette chercheuse dans plusieurs textes sur les relations Scandinavie-france. Il n’y a que les français qui ne sont pas encore au courant.\n\nEmma Levy :\n\tJe vais regarder. Restany connaissait Endre Tót. Il le comparait à Yves Klein\n\nPeut-être : Emmanuelle Rapin :\n\tOui probablement au moment où il l'a rencontré son travail méritait la comparaison. Je connais peu le travail de Klein finalement par rapport à celui de Tôt. Le Bleu éclipse trop souvent son saut dans le vide. je vais devoir m'atteler aussi à cet artiste un jour.\n\nEmma Levy :\n\tEndre Tót (né en 1937) comme le « Yves Klein de l'art postal ». En 1978, il qualifie le travail de Tót, notamment ses lettres remplies de zéros et ses « Rain Postcards », de « monochrome postal ». Restany a aussi répondu au questionnaire de Total questions by Tòt\n\nPeut-être : Emmanuelle Rapin :\n\toui c'est bien pour mes notes, merci, je viens de poser les pieds à Zurich. je vais vers le 7\n\nEmma Levy :\n\tNous t’attendons\n\nPeut-être : Emmanuelle Rapin :\n\tje viens de louper le 7 de 37, je prends celui de 47\n\nEmma Levy :\n\tOui\n\nPeut-être : Emmanuelle Rapin :\n\tRaphaël tu pourrais m'aider aux escaliers devant la Synagogue.?\n\nEmma Levy :\n\toui quand?\n\nPeut-être : Emmanuelle Rapin :\n\tje suis à Rietberg, je te téléphone lorsque je suis là \n\nEmma Levy :\n\toui\n\nPeut-être : Emmanuelle Rapin :\n\n\tcelui ci?\n\nEmma Levy :\n\n\n\n\n\n\n\thttps://lup.lub.lu.se/search/files/5853563/4092202.pdf\n\nPeut-être : Emmanuelle Rapin :\n\thttps://www.galaxus.ch/fr/s14/product/la-redoute-interieurs-hiba-85-x-50-x-180-cm-armoire-17958028#fullscreen=show\n\nEmma Levy :\n\thttps://thub.wordpress.com/2007/07/18/sjalvbiografiska-uppgifter-19786/\n\nPeut-être : Emmanuelle Rapin :\n\n\n\n\n\n\tdans le 7 depuis HB🦉\n\nEmma Levy :\n\n\nPeut-être : Emmanuelle Rapin :\n\tLe paradis sur terre \n\nEmma Levy :\n\tOui.\n\thttps://www.pafa.org/muse det die Zinkografie, ein photomechanisches Verfahren zur Übertragung des Bildes auf eine Zinkplatte, das auch als Fotozinkografie bezeichnet wird, zur Reproduktion ihrer Werke.\nDas ursprüngliche Bild wurde anhand eines fotografischen Negativs auf die Zinkplatte übertragen und anschließend chemisch behandelt, um den Druck zu ermöglichen: Die druckenden Partien nehmen die fetthaltige Farbe an, während die nicht druckenden Partien sie mithilfe von Wasser abstoßen. Das Bild wurde anschließend im Flachdruckverfahren auf Papier gedruckt, nach einem Prinzip, das der Lithografie nahekommt.\nDiese Technik war in der DDR für kostengünstige Kleinauflagen weit verbreitet.\n\tWolf-Rehfeldt wurde 1975 für die Mitgliedschaft im Verband bildender Künstler der DDR vorgeschlagen und 1978 als Vollmitglied aufgenommen. Aufgrund ihres besonderen Status als Mitglied des VBK durfte Wolf-Rehfeldt eine limitierte Auflage von 50 Exemplaren ihrer „Kleingrafiken“ in Druckereien drucken lassen. (Galerie Chert Lüdde) \n\n\"Als Verbandsmitglied durfte sie ihre Schreibmaschinen-Originale bis zu einer Auflage von 100 Stück vervielfältigen lassen. Meist ließ sie Zinkografien und Klischeedrucke oder später Siebdrucke in bis zu 50 Exemplaren herstellen »  (Text Dr. Luz Wohlrab in  Ausstellungskatalog Ruth Wolf-Rehfeldt. Tippen für den Druck: 14.02.-12.04.2025. Galerie aKonzept Berlin 08. Wohlrab Verlag, 2025. )\n\nEmma Levy :\n\thttps://chatgpt.com/share/69fa3d0f-a3e0-8386-8aac-e9050b0ccec1\n\tRitzau AFP Reuters Erik de Place event communication\n\thttps://we.tl/t-LaexvbgWqN6xUKSZ\n\tje suis dans le 7\n\nPeut-être : Emmanuelle Rapin :\n\t🦉\n\tQuoi qu'il en soit, nous continuons à suivre de près la Biennale d'art, car c'est rarement que les mécanismes absurdes de l'écosystème artistique mondial se révèlent aussi clairement.\n\tLetter and accompanying preparatory documents sent from Copenhagen to Jean Sellem by Tom Krøjer and Kristian Riis on 20 January 1977, including a provisional programme for the exhibition Peace Please.\n\tLettre et documents préparatoires envoyés de Copenhague à Jean Sellem par Tom Krøjer et Kristian Riis le 20 janvier 1977, comprenant un programme provisoire de l’exposition Peace Please.\n\tBrief und begleitende Vorbereitungsdokumente, die Tom Krøjer und Kristian Riis am 20. Januar 1977 aus Kopenhagen an Jean Sellem sandten, einschließlich eines vorläufigen Programms der Ausstellung Peace Please.\n\tEnveloppe contenant des documents de Tom Krøjer et Kristian Riis à Jean Sellem, 1/8\nDE\nUmschlag mit Dokumenten von Tom Krøjer und Kristian Riis an Jean Sellem, 1/8\n\n\nEmma Levy :\n\tSébastien Martinaud\n15 rue du Verdoyant \n49640 Daumeray \nFRANCE\n\nTEL: 0689792691\n\tsmartbastien@gmail.com\n\nPeut-être : Emmanuelle Rapin :\n\tThe English version follows the Swedish version\n\tFR\ninternational communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nNuméro de télex\nN° 15379 peace Dk.\nCopenhague, le 1er février 1977\nÀ la presse\nAu cours des cinq premiers jours de « l’événement international de communication », l’exposition d’art liée à l’événement a reçu des œuvres de plus de 60 artistes provenant de plusieurs pays. Des artistes travaillant avec de nouvelles formes d’expression, des concepts à partir de la photographie, de l’offset, des objets, des images transmises par télécopies, etc.\nL’exposition s’accroît chaque jour de nouvelles œuvres. Sur le télex et les photocopies de l’exposition, sont reçus chaque jour des œuvres, des idées et des questions envoyées par des artistes de nombreux pays.\nAu cours de la première semaine de l’exposition, un studio vidéo couleur spécial a également enregistré les spectacles et concerts qui ont eu lieu. Ces œuvres sont projetées pendant la journée dans l’exposition elle-même. Il y a eu jusqu’à présent des enregistrements d’événements avec :\nLeo Nilsson, compositeur électronique suédois, et les musiciens Arne Olsson, Bo Jagvar Olsson et Tom Krøjer.\nConférence et représentation avec le philosophe de l’art polonais Jarosław Kozłowski.\nPerformance et happening avec l’artiste Eric Andersen.\nConcert avec Don Cherry sur instruments africains.\nJazz d’avant-garde avec Jesper Zeuten et le groupe de free jazz de John Ravns.\nConcert avec Ballonparkens Balloner.\nConférence et happening avec Tom Krøjer.\nDans le temps à venir, il y aura une série d’événements de nature comparable.\nEN\ninternational communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex number\nNo. 15379 peace Dk.\nCopenhagen, 1 February 1977\nTo the press\nDuring the first five days of the “international communication event,” the art exhibition connected to the event has received works from more than 60 artists from a number of countries. Artists working with new forms of expression, concepts based on photography, offset, objects, images transmitted by telecopies, etc.\nThe exhibition is enlarged with new works every day. Through the exhibition’s telex and photocopies, works, ideas, and questions are received every day from artists in many countries.\nDuring the first week of the exhibition there is also a special colour video studio that has recorded performances and concerts that have taken place. These works are shown during the day in the exhibition itself. So far there have been recordings of events with:\nLeo Nilsson, Swedish electronic composer, and the musicians Arne Olsson, Bo Jagvar Olsson and Tom Krøjer.\nLecture and performance with the Polish art philosopher Jarosław Kozłowski.\nPerformance and happening with the artist Eric Andersen.\nConcert with Don Cherry on African instruments.\nAvant-garde jazz with Jesper Zeuten and John Ravns’ free jazz group.\nConcert with Ballonparkens Balloner.\nLecture and happening with Tom Krøjer.\nIn the coming period there will be a number of events of a similar kind.\nDE\ninternational communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex-Nummer\nNr. 15379 peace Dk.\nKopenhagen, den 1. Februar 1977\nAn die Presse\nIn den ersten fünf Tagen der „internationalen Kommunikationsveranstaltung“ sind für die mit der Veranstaltung verbundene Kunstausstellung Werke von über 60 Künstlern aus einer Reihe von Ländern eingegangen. Künstler, die mit neuen Ausdrucksformen arbeiten, mit Konzepten ausgehend von Fotografie, Offset, Objekten, durch Telekopien übertragenen Bildern usw.\nDie Ausstellung wird täglich durch neue Werke erweitert. Über das Telex und die Fotokopien der Ausstellung gehen jeden Tag Werke, Ideen und Fragen von Künstlern aus vielen Ländern ein.\nIn der ersten Woche der Ausstellung gibt es außerdem ein spezielles Farbvideostudio, das Aufnahmen von den Aufführungen und Konzerten gemacht hat, die stattgefunden haben. Diese Werke werden tagsüber in der Ausstellung selbst abgespielt. Bisher gab es Aufnahmen von Veranstaltungen mit:\nLeo Nilsson, schwedischer Elektronikkomponist, und den Musikern Arne Olsson, Bo Jagvar Olsson und Tom Krøjer.\nVortrag und Aufführung mit dem polnischen Kunstphilosophen Jarosław Kozłowski.\nPerformance und Happening mit dem Künstler Eric Andersen.\nKonzert mit Don Cherry auf afrikanischen Instrumenten.\nAvantgarde-Jazz mit Jesper Zeuten und John Ravns Free-Jazz-Gruppe.\nKonzert mit Ballonparkens Balloner.\nVortrag und Happening mit Tom Krøjer.\nIn der kommenden Zeit wird es eine Reihe von Veranstaltungen ähnlicher Art geben.\n\t« Peace Please ». Communiqué de presse sur les cinq premiers jours de la manifestation internationale sur la communication, 1er février 1977 – 1/2\n\t„Peace Please“. Pressemitteilung zu den ersten fünf Tagen der internationalen Kommunikationsveranstaltung, 1. Februar 1977 – 1/2\n\tFR\ninternational communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nNuméro de télex\nN° 15379 peace Dk.\n2\nCes événements seront annoncés progressivement.\nLa devise et le but de cette exposition « peace please » sont une mise en vie de la communication entre les êtres humains à travers les absurdes frontières nationales.\nLe rôle de l’art dans la communication internationale a été, et demeure, central.\nCette expérience d’exposition a pour but de concrétiser les principes des accords d’Helsinki sur le libre échange des idées et des expressions culturelles et artistiques. Elle sera réalisée par des personnes qui ont le courage de se fonder sur la confiance en leurs semblables.\nPour atteindre cet objectif, nous utilisons la technologie électronique moderne et voulons ainsi construire la force de travail intemporelle et universelle de l’art, qui est la coexistence pacifique.\nLes expositions de Huset\net Tom Krøjer\nCi-joint une liste des artistes participants.\nEN\ninternational communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex number\nNo. 15379 peace Dk.\n2\nThese events will be announced continuously.\nThe motto and purpose of this exhibition, “peace please,” are a bringing to life of communication between people across absurd national borders.\nThe role of art in international communication has been, and remains, central.\nThe purpose of this exhibition experiment is to realize the principles of the Helsinki Accords concerning the free exchange of ideas and cultural and artistic expressions. It will be carried out by people who have the courage to base themselves on trust in their fellow human beings.\nTo achieve this, we use modern electronic technology and with it seek to build up art’s timeless and all-embracing working force, which is peaceful coexistence.\nHuset’s exhibitions\nand Tom Krøjer\nEnclosed is a list of the participating artists.\nDE\ninternational communication event\n27/1 - 10/2. 1977. copenhagen Dk.\ntelephone 01 - 142665. huset Tom Krøjer\nmagstræde 14. 1166. copenhagen. K.\nTelex-Nummer\nNr. 15379 peace Dk.\n2\nDiese Veranstaltungen werden laufend angekündigt.\nDas Motto und der Zweck dieser Ausstellung „peace please“ sind eine Verlebendigung der Kommunikation zwischen Menschen über die absurden nationalen Grenzen hinweg.\nDie Rolle der Kunst in der internationalen Kommunikation war und ist zentral.\nDieses Ausstellungsexperiment hat das Ziel, die Prinzipien der Helsinki-Abkommen über den freien Austausch von Ideen und kulturellen sowie künstlerischen Ausdrucksformen zu verwirklichen. Es wird von Menschen realisiert werden, die den Mut haben, sich auf das Vertrauen in den Mitmenschen zu gründen.\nUm dies zu erreichen, verwenden wir die moderne elektronische Technologie und wollen damit die zeitlose und allumfassende Arbeitskraft der Kunst aufbauen, die in der friedlichen Koexistenz besteht.\nHusets Ausstellungen\nund Tom Krøjer\nBeigefügt ist eine Liste der teilnehmenden Künstler.\n\tFR\nINTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\ncat. I\nLe numéro de télex de l’exposition est : 15379 peace DK.\nLe numéro de téléphone pour la télé-copie de l’exposition est le (01) 142665.\nToutes les propositions et toutes les participations sont les bienvenues et sont considérées comme une partie de l’exposition.\nDans l’exposition, il y aura un studio vidéo couleur, qui pourra également être utilisé.\nL’exposition deviendra une forme fondamentalement nouvelle d’exposition d’art. Elle deviendra un organisme vivant biologico-technique, en constante transformation, et, par son mode global de communication, elle sera constamment sensible aux idées du nouvel art.\nCi-joint, un annexe / document joint concernant les événements (provisoires) liés à l’exposition.\nCordialement,\nTom Krøjer et Kristian Riis\n[texte imprimé latéral]\n“PEACE PLEASE” TOM KRØJER LIEU DE L’EXPOSITION : HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TÉL. 01-142665\n[texte imprimé en bas de page]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TÉL. 046/14 78 00\nEN\nINTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\ncat. I\nThe exhibition’s telex number is: 15379 peace DK.\nThe exhibition’s telecopy telephone number is (01) 142665.\nAll proposals and participation are welcome and are regarded as part of the exhibition.\nAt the exhibition there will be a colour video studio, which may also be used.\nThe exhibition will become a fundamentally new form of art exhibition. It will become a biologically-technical living organism, in constant change, and through its global mode of communication it will remain constantly responsive to the ideas of the new art.\nEnclosed is an attachment concerning events (provisional) in connection with the exhibition.\nYours sincerely,\nTom Krøjer and Kristian Riis\n[side printed text]\n“PEACE PLEASE” TOM KRØJER EXHIBITION LOCATION: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL 01-142665\n[bottom printed text]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL 046/14 78 00\nDE\nINTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\ncat. I\nDie Telexnummer der Ausstellung lautet: 15379 peace DK.\nDie Telecopy-Telefonnummer der Ausstellung ist (01) 142665.\nAlle Vorschläge und jede Mitwirkung sind willkommen und werden als Teil der Ausstellung betrachtet.\nIn der Ausstellung wird es ein Farbvideostudio geben, das ebenfalls benutzt werden kann.\nDie Ausstellung wird eine grundlegend neue Form der Kunstausstellung werden. Sie wird zu einem biologisch-technischen lebenden Organismus, in ständiger Veränderung, und sie wird durch ihre globale Kommunikationsweise fortwährend empfindsam gegenüber den Ideen der neuen Kunst sein.\nBeigefügt ist eine Anlage über Veranstaltungen (vorläufig) im Zusammenhang mit der Ausstellung.\nMit freundlichen Grüßen\nTom Krøjer und Kristian Riis\n[seitlicher Drucktext]\n“PEACE PLEASE” TOM KRØJER AUSSTELLUNGSORT: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL. 01-142665\n[Drucktext am unteren Seitenrand]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL. 046/14 78 00\n\tFR\nINTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\nCommuniqué de presse\ncat. I\nHuset Magstræde 14, 1466 Kbh K, le 20 janvier 1977\nEXPOSITION-CRISE-ÉCONOMIE ET ÉVÉNEMENT DE COMMUNICATION POUR LA PAIX\nDu 27 janvier au 10 février, le peintre, artiste des médias et multimédia, ainsi que poète lyrique Tom Krøjer organise, en collaboration avec Jean Sellem, « Archiv of experimental and marginal art Lund Sweden », des artistes danois et étrangers, des chercheurs pour la paix, des économistes et d’autres encore, une exposition et un événement de communication à Huset, à Copenhague. Dans l’espace d’exposition situé au 2e étage, sera construite une série de structures prenant pour point de départ les notions et réalités économiques qui sont fondamentales pour la crise économique actuelle. Il sera possible de travailler avec cette structure pendant l’exposition, de la transformer, de la discuter et de la compléter. La devise de cette partie de l’exposition est : « La crise de l’économie ou de l’imagination ». Un groupe d’économistes a participé à son élaboration. Autour de cette partie de l’exposition auront lieu des discussions, conférences, entretiens, etc., entre artistes, visiteurs de l’exposition, économistes, hommes politiques, etc. Tom Krøjer dit à propos de cette partie : « L’art se développe aussi en intégrant de nouveaux domaines de la société dans sa sphère, et cette exposition sur l’économie sera une expérience avec tous les concepts, idées et relations de l’économie politique. Je vais essayer de créer une sculpture spatiale flexible avec ces concepts, que le public pourra déplacer, contribuant ainsi à créer une image du monde économique produite démocratiquement. »\nLa seconde partie de l’exposition est un « événement de communication et jeu de paix ». Pour cette partie de l’exposition, nous avons invité, en collaboration avec l’Archiv of experimental art à Lund, un certain nombre d’artistes de la communication, marginaux et contemporains du monde entier. Dans l’espace d’exposition ont été installés un appareil télex et une machine de transmission téléphonique d’images, qui pourront être utilisés pendant l’exposition pour envoyer et recevoir des informations, des idées, des poèmes, des photographies et des images, des questions sur les conditions de la paix et les tendances de la crise, ainsi que des choses que les différents artistes souhaitent communiquer. Les appareils pourront être utilisés durant l’exposition. C’est la première fois que le télex est utilisé à grande échelle comme médium artistique. Le jeu de paix consiste à amener des artistes de différents pays à communiquer leurs idées, informations, concepts, etc., sur la possibilité d’une paix ordinaire à travers le système de l’appareil télex. Outre le télex, des formes traditionnelles de communication comme les lettres, les colis postaux, les télégrammes, le téléphone, le film, la vidéo, etc., seront utilisées. Cette partie porte surtout sur les conflits et l’armement. Malheureusement, ces problèmes ne sont pas considérés comme graves par la majorité. Peut-être les artistes peuvent-ils contribuer à créer le climat d’opinion nécessaire pour amener les gens à dire non à l’investissement d’argent et de travail dans toute production susceptible de contribuer à la guerre.\n[texte imprimé latéral]\n« PEACE PLEASE » TOM KRØJER LIEU DE L’EXPOSITION : HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TÉL. 01-142665\n[texte imprimé en bas de page]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TÉL. 046/14 78 00\n\tEN\nINTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\nPress release\ncat. I\nHuset Magstræde 14, 1466 Kbh K, 20 January 1977\nECONOMY-CRISIS EXHIBITION AND PEACE COMMUNICATION EVENT\nFrom 27 January to 10 February, the painter, media and multi-artist, and lyric poet Tom Krøjer, in collaboration with Jean Sellem, the “Archiv of experimental and marginal art Lund Sweden,” Danish and foreign artists, peace researchers, economists and others, is organising an exhibition and communication event at Huset in Copenhagen. In the exhibition space on the 2nd floor, a series of structures will be built that take up the economic concepts and realities fundamental to the current economic crisis. It will be possible to work with this structure during the exhibition, to alter it, discuss it and supplement it. The motto for this part of the exhibition is “The crisis of the economy or of the imagination.” A group of economists has taken part in shaping it. Around this part of the exhibition there will be discussions, lectures, conversations, etc., between artists, exhibition visitors, economists, politicians, and so on. Tom Krøjer says about this part: “Art also develops by drawing new areas of society into its sphere, and this economy exhibition will be an experiment with all the concepts, ideas and relations of political economy. I will try to make a flexible spatial sculpture with these concepts, which the public can move around and thereby take part in creating a democratically produced image of economic life.”\nThe second part of the exhibition is a “communication event and peace game.” For this part of the exhibition, in collaboration with the Archiv of experimental art in Lund, we have invited a number of communication, marginal and contemporary artists from all over the world. In the exhibition space there is a telex machine and a telephone image-transmission machine, which during the exhibition can be used to send and receive information, ideas, poems, photographs and images, questions about the conditions of peace and crisis tendencies, as well as things that the individual artists wish to communicate. The devices will be available for use during the exhibition. This is the first time telex is being used on a large scale as an artistic medium. The peace game consists in getting artists in different countries to communicate their ideas, information, concepts, etc., about the possibility of ordinary peace through the telex system. In addition to telex, traditional forms of communication such as letters, parcels, telegrams, telephone, film, video, etc., will be used. This part mainly concerns conflicts and armament. Unfortunately, these problems are not regarded as serious by the majority. Perhaps artists can help create the climate of opinion needed to make people say no to the investment of money and labour in any production that may contribute to war.\n[side printed text]\n“PEACE PLEASE” TOM KRØJER EXHIBITION LOCATION: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL 01-142665\n[bottom printed text]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL 046/14 78 00\n\tDE\nINTERNATIONAL COMMUNICATION EVENT 27/1–10/2 1977 COPENHAGEN DENMARK TELEX NR 15379\nPressemitteilung\ncat. I\nHuset Magstræde 14, 1466 Kbh K, den 20. Januar 1977\nÖKONOMIE-KRISEN-AUSSTELLUNG UND FRIEDENSKOMMUNIKATIONSEREIGNIS\nVom 27. Januar bis 10. Februar veranstaltet der Maler, Medien- und Multikünstler sowie Lyriker Tom Krøjer in Zusammenarbeit mit Jean Sellem, dem „Archiv of experimental and marginal art Lund Sweden“, dänischen und ausländischen Künstlern, Friedensforschern, Ökonomen u. a. eine Ausstellung und ein Kommunikationsereignis im Huset in Kopenhagen. Im Ausstellungsraum im 2. Stock wird eine Reihe von Strukturen aufgebaut, die die ökonomischen Begriffe und Realitäten aufgreifen, die für die gegenwärtige ökonomische Krise grundlegend sind. Es wird möglich sein, während der Ausstellung mit dieser Struktur zu arbeiten, sie zu verändern, zu diskutieren und zu ergänzen. Das Motto dieses Teils der Ausstellung lautet: „Die Krise der Ökonomie oder der Phantasie“. Eine Gruppe von Ökonomen hat an ihrer Ausarbeitung mitgewirkt. Um diesen Teil der Ausstellung herum wird es Diskussionen, Vorträge, Gespräche usw. zwischen Künstlern, Ausstellungsbesuchern, Ökonomen, Politikern usw. geben. Tom Krøjer sagt zu diesem Teil: „Die Kunst entwickelt sich auch dadurch weiter, dass sie neue Gesellschaftsbereiche in ihre Sphäre einbezieht, und diese Ökonomie-Ausstellung wird ein Experiment mit allen Begriffen, Ideen und Beziehungen der Volkswirtschaft sein. Ich werde versuchen, mit diesen Begriffen eine flexible Raumskulptur zu schaffen, die das Publikum umstellen kann und dadurch an der demokratischen Hervorbringung eines Bildes des wirtschaftlichen Lebens beteiligt ist.“\nDer zweite Teil der Ausstellung ist ein „Kommunikationsereignis und Friedensspiel“. Für diesen Teil der Ausstellung haben wir in Zusammenarbeit mit dem Archiv of experimental art in Lund eine Reihe von Kommunikations-, Marginal- und Gegenwartskünstlern aus der ganzen Welt eingeladen. Im Ausstellungsraum sind ein Telexgerät und eine telefonische Bildübertragungsmaschine aufgestellt, die während der Ausstellung dazu benutzt werden können, Informationen, Ideen, Gedichte, Fotografien und Bilder, Fragen nach den Bedingungen des Friedens und den Krisentendenzen sowie Dinge zu senden und zu empfangen, die die einzelnen Künstler kommunizieren möchten. Die Geräte können während der Ausstellung genutzt werden. Es ist das erste Mal, dass Telex in großem Maßstab als künstlerisches Medium eingesetzt wird. Das Friedensspiel besteht darin, Künstler in verschiedenen Ländern dazu zu bringen, ihre Ideen, Informationen, Konzepte usw. über die Möglichkeit eines gewöhnlichen Friedens über das System des Telexgeräts zu kommunizieren. Außer Telex werden traditionelle Kommunikationsformen wie Briefe, Paketpost, Telegramme, Telefon, Film, Video usw. verwendet. Dieser Teil befasst sich vor allem mit Konflikten und Aufrüstung. Leider werden diese Probleme von der Mehrheit nicht als ernst angesehen. Vielleicht können Künstler dazu beitragen, das Meinungsklima zu schaffen, das nötig ist, damit Menschen Nein dazu sagen, Geld und Arbeit in jede Form von Produktion zu investieren, die zum Krieg beitragen kann.\n[seitlicher Drucktext]\n“PEACE PLEASE” TOM KRØJER AUSSTELLUNGSORT: HUSET MAGSTRÆDE 14 DK-1166 COPENHAGEN K DENMARK TEL. 01-142665\n[Drucktext am unteren Seitenrand]\nARCHIVE OF EXPERIMENTAL AND MARGINAL ART FACK 7 22101 LUND 1 SWEDEN TEL. 046/14 78 00"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0003.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0003.webp"},{"uid":"dmopn9i37swzpu","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0004.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Handwritten Programme Notes for Performances, Concerts and Film Screening, in Danish 4/8","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0004.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0004.webp"},{"uid":"dmopn9i37aod12","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0005.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Draft, Document 3/8 - 5/8","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archi relatedUrl":"","title":{"en":"Draft, Document 3/8 - 8/8","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0008.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-lettre-tom-krojer-a-jean-sellem-0008.webp"},{"uid":"dmopn9i37fxwhl","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-invitation-0003.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Open Call Sent by Galerie S:t Petri for the International Communication Event, Copenhagen.","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-invitation-0003.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-invitation-0003.webp"},{"uid":"dmopn9i377j5on","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-steen-hoyer-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Peace Please. Letter from Steen Høyer Accepting the Invitation","fr":"","de":""},"text":{"en":"Hi! — Thank you for the invitation — first I would like to hear where one can most easily obtain SIPRI’s publications, since your information is a little difficult to understand in its very concise form. Is 280 billion dollars distributed among the entire world population a lot?\n\nDoubtful whether a telex can be obtained — could there not be several about one!?\n\nWell — I will in any case be happy to contribute with one thing or another; in what form, I shall let you know when it is clearer!\n\nMany greetings from\n\nSteen Høyer\nLl. Strandstræde 12a,\nDK-1254 K\n\n01/146234","fr":"Bonjour ! — Merci pour l’invitation — j’aimerais d’abord savoir où l’on peut se procurer le plus facilement les publications du SIPRI, car vos informations sont un peu difficiles à comprendre sous leur forme très condensée. Est-ce que 280 milliards de dollars répartis sur l’ensemble de la population mondiale, c’est beaucoup ?\n\nIl est douteux qu’on puisse obtenir un télex — ne pourrait-il pas y en avoir plusieurs autour d’un seul !?\n\nBon — je contribuerai en tout cas volontiers par quelque chose ; sous quelle forme, je vous le ferai savoir quand ce sera plus clair !\n\nBien des salutations de\n\nSteen Høyer\nLl. Strandstræde 12a,\nDK-1254 K\n\n01/146234","de":"Hallo! — Vielen Dank für die Einladung — zunächst würde ich gerne wissen, wo man am einfachsten die Publikationen des SIPRI bekommen kann, da eure Angaben in der sehr gedrängten Form etwas schwer verständlich sind. Sind 280 Milliarden Dollar, verteilt auf die gesamte Weltbevölkerung, viel?\n\nOb ein Telex beschafft werden kann, ist fraglich — könnte es nicht mehrere zu einem geben!?\n\nNun — jedenfalls werde ich gerne mit dem einen oder anderen beitragen; in welcher Form, werde ich mitteilen, sobald es klarer ist!\n\nViele Grüße von\n\nSteen Høyer\nLl. Strandstræde 12a,\nDK-1254 K\n\n01/146234"},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-steen-hoyer-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-steen-hoyer-0001.webp"},{"uid":"dmopn9i37n1nxi","kind":"before","filename":"27-1-10-2-1977-peace-please-affiche-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"[[find:communication-press-coverage-0003|A4-format exhibition poster affixed to the gallery frontage in Lund.]]","fr":"[[find:communication-press-coverage-0003|Affiche de l'exposition de format A4 qui était fixée sur la devanture de la galerie à Lund.]]","de":"[[find:communication-press-coverage-0003|Ausstellungsplakat im A4-Format, das an der Schaufensterfront der Galerie in Lund angebracht war.]]"},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-affiche-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-affiche-0001.webp"},{"uid":"dmopn9i37878ap","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-invitation-0001.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Pass card Valid for all events and exhibitions during the whole period. Recto/Verso","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-invitation-0001.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/originals/27-1-10-2-1977-peace-please-international-communication-invitation-0001.webp"},{"uid":"dmopn9i37587ca","kind":"before","filename":"27-1-10-2-1977-peace-please-international-communication-invitation-0002.webp","date":"","caption":"","artists":[],"relatedUrl":"","title":{"en":"Thank you A5 Postcard","fr":"","de":""},"text":{"en":"","fr":"","de":""},"url":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/before/pages/27-1-10-2-1977-peace-please-international-communication-invitation-0002.webp","originalUrl":"https://cdn.jsdelivr.net/gh/rphl66/archive-jeansellem@main/1977/1977%20PEACE%20PLEASE/befo
